# 프론트엔드(frontend/, Next.js) 검사: 타입 · 린트 · 단위 테스트 · 배포 빌드 · 실험실 빠짐
# 팀 리포에 넣을 것(tools/team-import/team/frontend-ci.yml)과 같은 단계. 이 리포에서는 main 푸시에도 돎 (2026-11-23)
name: frontend-ci

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "docs/backend/team-spec/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "docs/backend/team-spec/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # 프론트엔드(Next.js)의 타입 검사, 린트, 단위 테스트, 배포 빌드를 확인하고, 배포 빌드에 실험실이 빠졌는지 검사한다.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 의존성 설치
        run: npm ci
      - name: 타입 검사
        run: npm run typecheck
      - name: 린트
        run: npm run lint
      - name: 단위 테스트
        # 명세 대조 테스트가 저장소의 docs/api, docs/spec 을 읽는다
        run: npm test
      - name: 배포 빌드
        run: npm run build
      - name: 실험실 빠짐 검사
        # 위 배포 빌드(실험실 끔) 결과에 실험실 주소와 코드가 없는지 본다
        run: npm run check:labs-off -- --no-build
