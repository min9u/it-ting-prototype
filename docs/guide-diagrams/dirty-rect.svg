<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="저사양 부분 그리기: 다시 그릴 사각형을 두더지 발밑 기준점 둘레로만 잡아 떨어지는 두더지의 머리가 잘리고 잔상이 남았고, 기준점·뼈마다·액세서리 상자를 합친 사각형으로 바꿔 고쳤다" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" style="fill:var(--ink,#3e2a1f)">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink-soft,#5c4334)"/></marker>
    <clipPath id="oldrect"><rect x="156" y="234" width="80" height="70"/></clipPath>
  </defs>
  <rect width="760" height="430" rx="14" style="fill:var(--fig-bg,#fffaf4)"/>
  <text x="380" y="32" text-anchor="middle" font-size="12" style="fill:var(--ink-soft,#5c4334)">저사양 “부분 그리기”: 매 프레임 사각형 안만 지우고 다시 그린다. 사각형 밖은 지난 그림이 그대로 남는다</text>

  <!-- ===== 고치기 전 ===== -->
  <rect x="16" y="48" width="360" height="368" rx="12" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
  <text x="28" y="72" font-size="12.5" font-weight="700" style="fill:var(--chip-rose-fg,#7d3a3f)">고치기 전: 기준점 둘레만</text>
  <path d="M56,300 L56,180 Q56,92 196,92 Q336,92 336,180 L336,300 Z" style="fill:var(--fig-bg,#fffaf4);stroke:var(--box-line,#e3cbb5)" stroke-width="1.5"/>
  <ellipse cx="196" cy="93" rx="24" ry="6" style="fill:var(--ink-mute,#8a7262)"/>
  <text x="228" y="88" font-size="11" style="fill:var(--ink-mute,#8a7262)">천장 구멍</text>
  <line x1="56" y1="300" x2="336" y2="300" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.5"/>
  <!-- 낙하 방향 -->
  <line x1="264" y1="120" x2="264" y2="190" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <text x="272" y="160" font-size="11" style="fill:var(--ink-soft,#5c4334)">떨어지는 중</text>
  <!-- 잔상: 지난 프레임 머리 -->
  <g opacity="0.45">
    <ellipse cx="196" cy="150" rx="22" ry="16" style="fill:var(--strong,#6b4a3a)"/>
    <ellipse cx="196" cy="134" rx="15" ry="5" style="fill:var(--accent,#9a4a2c)"/>
  </g>
  <text x="86" y="140" font-size="11" style="fill:var(--chip-rose-fg,#7d3a3f)">잔상</text>
  <text x="70" y="155" font-size="11" style="fill:var(--chip-rose-fg,#7d3a3f)">(안 지워짐)</text>
  <!-- 두더지: 사각형 안만 그려짐 -->
  <g clip-path="url(#oldrect)">
    <ellipse cx="196" cy="222" rx="26" ry="30" style="fill:var(--strong,#6b4a3a)"/>
  </g>
  <ellipse cx="196" cy="222" rx="26" ry="30" style="fill:none;stroke:var(--strong,#6b4a3a)" stroke-dasharray="3 3"/>
  <ellipse cx="196" cy="193" rx="16" ry="5" style="fill:none;stroke:var(--accent,#9a4a2c)" stroke-dasharray="3 3"/>
  <text x="104" y="206" font-size="11" style="fill:var(--chip-rose-fg,#7d3a3f)">머리 잘림</text>
  <!-- 기준점 -->
  <circle cx="196" cy="300" r="4" style="fill:var(--cta,#c8643a)"/>
  <text x="244" y="320" font-size="11" style="fill:var(--ink-soft,#5c4334)">기준점 (발밑)</text>
  <!-- 사각형 -->
  <rect x="156" y="234" width="80" height="70" style="fill:none;stroke:var(--cta,#c8643a)" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="28" y="350" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">사각형 = 기준점(발밑)에 세운 상자 하나</text>
  <text x="28" y="370" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">떨어지기 동작은 기준점은 바닥에 두고 뼈대만</text>
  <text x="28" y="388" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">천장에서 내려오게 움직임 → 위쪽은 사각형 밖</text>

  <!-- ===== 고친 뒤 ===== -->
  <rect x="388" y="48" width="356" height="368" rx="12" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
  <text x="400" y="72" font-size="12.5" font-weight="700" style="fill:var(--chip-mint-fg,#2e5e4c)">고친 뒤: 보이는 부분을 다 덮는 사각형</text>
  <path d="M428,300 L428,180 Q428,92 568,92 Q708,92 708,180 L708,300 Z" style="fill:var(--fig-bg,#fffaf4);stroke:var(--box-line,#e3cbb5)" stroke-width="1.5"/>
  <ellipse cx="568" cy="93" rx="24" ry="6" style="fill:var(--ink-mute,#8a7262)"/>
  <line x1="428" y1="300" x2="708" y2="300" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.5"/>
  <!-- 두더지 전체 -->
  <ellipse cx="568" cy="222" rx="26" ry="30" style="fill:var(--strong,#6b4a3a)"/>
  <ellipse cx="568" cy="193" rx="16" ry="5" style="fill:var(--accent,#9a4a2c)"/>
  <!-- 뼈 -->
  <g style="fill:var(--chip-sky-fg,#2f5868)">
    <circle cx="568" cy="244" r="2.5"/>
    <circle cx="568" cy="222" r="2.5"/>
    <circle cx="568" cy="202" r="2.5"/>
  </g>
  <g style="fill:none;stroke:var(--chip-sky-fg,#2f5868)" stroke-width="1" stroke-dasharray="3 2">
    <rect x="546" y="222" width="44" height="44"/>
    <rect x="546" y="200" width="44" height="44"/>
    <rect x="546" y="180" width="44" height="44"/>
  </g>
  <!-- 액세서리 상자 -->
  <rect x="549" y="185" width="38" height="14" style="fill:none;stroke:var(--accent,#9a4a2c)" stroke-width="1.2" stroke-dasharray="3 2"/>
  <!-- 기준점 상자 -->
  <rect x="528" y="234" width="80" height="70" style="fill:none;stroke:var(--ink-mute,#8a7262)" stroke-width="1" stroke-dasharray="3 2"/>
  <circle cx="568" cy="300" r="4" style="fill:var(--cta,#c8643a)"/>
  <!-- 합친 사각형 -->
  <rect x="524" y="174" width="88" height="134" style="fill:none;stroke:var(--cta,#c8643a)" stroke-width="2.2"/>
  <line x1="614" y1="186" x2="636" y2="164" style="stroke:var(--cta,#c8643a)" stroke-width="1.2"/>
  <text x="638" y="160" font-size="11" style="fill:var(--cta,#c8643a)">합친 사각형</text>
  <!-- 범례 -->
  <rect x="400" y="335" width="14" height="10" style="fill:none;stroke:var(--ink-mute,#8a7262)" stroke-dasharray="3 2"/>
  <text x="420" y="345" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">기준점 상자</text>
  <rect x="510" y="335" width="14" height="10" style="fill:none;stroke:var(--chip-sky-fg,#2f5868)" stroke-dasharray="3 2"/>
  <text x="530" y="345" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">뼈마다 ±0.5m</text>
  <rect x="628" y="335" width="14" height="10" style="fill:none;stroke:var(--accent,#9a4a2c)" stroke-dasharray="3 2"/>
  <text x="648" y="345" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">액세서리</text>
  <text x="400" y="370" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">셋을 합친 사각형 + 지난 프레임 사각형을 다시 그림</text>
  <text x="400" y="388" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">→ 잔상 픽셀 0 (roomScene.ts actorRect)</text>
</svg>
