<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="에러 경계는 맨 바깥, 로그인 영역 틀, 화면 하나의 세 겹이고 그 안에 3D 경계가 따로 있어 깨진 칸만 안내로 바뀌며, 데이터·쓰기 실패는 경계가 아니라 QueryGate와 useOptimistic이 처리한다" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" style="fill:var(--ink,#3e2a1f)">
  <rect width="760" height="420" rx="14" style="fill:var(--fig-bg,#fffaf4)"/>

  <!-- 1 맨 바깥 -->
  <rect x="16" y="16" width="484" height="388" rx="12" style="fill:var(--box,#f4e6d8);stroke:var(--ink-mute,#8a7262)" stroke-width="1.4"/>
  <circle cx="40" cy="38" r="11" style="fill:var(--cta,#c8643a)"/>
  <text x="40" y="42.5" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--on-strong,#fbf4ec)">1</text>
  <text x="58" y="43" font-weight="700">맨 바깥 경계</text>
  <text x="152" y="43" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">모든 화면의 마지막 그물 (기본 영어 에러 화면 대신)</text>
  <g font-size="12" text-anchor="middle">
    <rect x="30" y="60" width="98" height="26" rx="13" style="fill:var(--fig-bg,#fffaf4);stroke:var(--box-line,#e3cbb5)"/>
    <text x="79" y="77.5">시작 화면</text>
    <rect x="136" y="60" width="98" height="26" rx="13" style="fill:var(--fig-bg,#fffaf4);stroke:var(--box-line,#e3cbb5)"/>
    <text x="185" y="77.5">로그인 · 가입</text>
    <rect x="242" y="60" width="98" height="26" rx="13" style="fill:var(--fig-bg,#fffaf4);stroke:var(--box-line,#e3cbb5)"/>
    <text x="291" y="77.5">온보딩</text>
    <rect x="348" y="60" width="98" height="26" rx="13" style="fill:var(--fig-bg,#fffaf4);stroke:var(--box-line,#e3cbb5)"/>
    <text x="397" y="77.5">관리자</text>
  </g>

  <!-- 2 로그인 영역 틀 -->
  <rect x="30" y="100" width="456" height="290" rx="10" style="fill:var(--fig-bg,#fffaf4);stroke:var(--accent,#9a4a2c)" stroke-width="1.4"/>
  <circle cx="54" cy="122" r="11" style="fill:var(--cta,#c8643a)"/>
  <text x="54" y="126.5" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--on-strong,#fbf4ec)">2</text>
  <text x="72" y="127" font-weight="700">로그인 영역 틀 (AppLayout)</text>
  <text x="262" y="127" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">헤더 자체가 깨질 때</text>
  <rect x="44" y="140" width="428" height="30" rx="6" style="fill:var(--strong,#6b4a3a)"/>
  <text x="58" y="160" font-weight="700" style="fill:var(--on-strong,#fbf4ec)">헤더 (땅굴 · 커뮤니티 · 모임 · 채팅)</text>
  <text x="458" y="160" text-anchor="end" font-size="11.5" style="fill:var(--on-strong,#fbf4ec)">깨져도 남음</text>

  <!-- 3 화면 하나 -->
  <rect x="44" y="180" width="428" height="196" rx="10" style="fill:var(--box,#f4e6d8);stroke:var(--cta,#c8643a)" stroke-width="1.6"/>
  <circle cx="68" cy="202" r="11" style="fill:var(--cta,#c8643a)"/>
  <text x="68" y="206.5" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--on-strong,#fbf4ec)">3</text>
  <text x="86" y="207" font-weight="700">화면 하나 (RouteError inline)</text>
  <text x="58" y="230" font-size="12" style="fill:var(--ink-soft,#5c4334)">화면 코드가 깨지면 이 칸만 바뀜:</text>
  <text x="58" y="248" font-size="12" font-weight="700" style="fill:var(--accent,#9a4a2c)">“잠시 문제가 생겼어요 · 다시 시도”</text>
  <text x="58" y="266" font-size="11.5" style="fill:var(--ink-mute,#8a7262)">재배포 뒤 옛 파일(청크 404)이면 한 번만 새로고침</text>

  <!-- 3D 경계 -->
  <rect x="58" y="280" width="400" height="84" rx="8" style="fill:var(--fig-bg,#fffaf4);stroke:var(--cta,#c8643a)" stroke-dasharray="5 4"/>
  <rect x="70" y="291" width="34" height="22" rx="11" style="fill:var(--cta,#c8643a)"/>
  <text x="87" y="306.5" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--on-strong,#fbf4ec)">3D</text>
  <text x="112" y="307" font-weight="700">3D 경계 (SceneBoundary)</text>
  <text x="72" y="331" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">3D 자리만 비우고 깔아 둔 정지 그림 · 2D 두더지를 보여 줌</text>
  <text x="72" y="351" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">옛 탭이면 “새 버전이 나왔어요 · 새로고침” 버튼</text>

  <!-- 경계가 잡지 않는 것 -->
  <rect x="516" y="16" width="228" height="388" rx="12" style="fill:var(--chip-butter-bg,#f3e6be)"/>
  <text x="530" y="43" font-weight="700" style="fill:var(--chip-butter-fg,#6b5410)">경계가 잡지 않는 것</text>
  <text x="530" y="62" font-size="11.5" style="fill:var(--chip-butter-fg,#6b5410)">그리기 밖에서 난 실패는 따로 처리</text>

  <rect x="528" y="76" width="204" height="92" rx="8" style="fill:var(--fig-bg,#fffaf4)"/>
  <text x="540" y="98" font-weight="700">데이터를 못 받음</text>
  <text x="540" y="117" font-size="11.5" font-family="'Nanum Gothic Coding',Consolas,monospace" style="fill:var(--accent,#9a4a2c)">QueryGate</text>
  <text x="540" y="137" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">404 → 없음 안내</text>
  <text x="540" y="155" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">그 밖 → 다시 시도</text>

  <rect x="528" y="178" width="204" height="92" rx="8" style="fill:var(--fig-bg,#fffaf4)"/>
  <text x="540" y="200" font-weight="700">쓰기 실패 (찜 등)</text>
  <text x="540" y="219" font-size="11.5" font-family="'Nanum Gothic Coding',Consolas,monospace" style="fill:var(--accent,#9a4a2c)">useOptimistic</text>
  <text x="540" y="239" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">화면을 되돌리고</text>
  <text x="540" y="257" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">빨간 토스트</text>

  <rect x="528" y="280" width="204" height="72" rx="8" style="fill:var(--fig-bg,#fffaf4)"/>
  <text x="540" y="302" font-weight="700">버튼 누름 · 비동기 코드</text>
  <text x="540" y="322" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">그 코드가 직접 잡아서</text>
  <text x="540" y="340" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">안내를 띄움</text>

  <text x="530" y="380" font-size="11.5" style="fill:var(--chip-butter-fg,#6b5410)">없는 주소는 맨 끝 라우트 *</text>
  <text x="530" y="396" font-size="11.5" style="fill:var(--chip-butter-fg,#6b5410)">→ “없는 주소예요”</text>
</svg>
