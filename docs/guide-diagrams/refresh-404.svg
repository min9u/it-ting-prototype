<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" width="760" height="452" role="img" aria-label="앱 안 이동은 서버에 묻지 않지만 새로고침은 서버에 그 주소의 파일을 요청해 404가 나고, 실서버는 Nginx가 index.html을 돌려주고 공유본은 해시 주소라 서버에 / 만 간다" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" style="fill:var(--ink,#3e2a1f)">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink-soft,#5c4334)"/></marker>
  </defs>
  <rect width="760" height="452" rx="14" style="fill:var(--fig-bg,#fffaf4)"/>

  <!-- 범례 -->
  <g font-size="11.5" style="fill:var(--ink-soft,#5c4334)">
    <rect x="452" y="12" width="12" height="12" rx="3" style="fill:var(--chip-clay-bg,#f1dccb)"/>
    <text x="469" y="22">브라우저</text>
    <rect x="530" y="12" width="12" height="12" rx="3" style="fill:var(--chip-sky-bg,#d9e6ec)"/>
    <text x="547" y="22">서버</text>
    <rect x="590" y="12" width="12" height="12" rx="3" style="fill:var(--chip-mint-bg,#d5e8df)"/>
    <text x="607" y="22">화면이 뜸</text>
    <rect x="672" y="12" width="12" height="12" rx="3" style="fill:var(--chip-rose-bg,#f2d9d9)"/>
    <text x="689" y="22">실패</text>
  </g>

  <!-- ① 앱 안 이동 -->
  <circle cx="27" cy="22" r="11" style="fill:var(--cta,#c8643a)"/>
  <text x="27" y="26.5" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--on-strong,#fbf4ec)">1</text>
  <text x="46" y="27" font-weight="700">앱 안에서 이동 (메뉴를 누름)</text>
  <rect x="16" y="40" width="170" height="58" rx="10" style="fill:var(--chip-clay-bg,#f1dccb)"/>
  <text x="30" y="63" font-weight="700">메뉴 누름</text>
  <text x="30" y="83" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">주소만 /burrow/yerin 으로</text>
  <line x1="188" y1="69" x2="284" y2="69" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="236" y="61" text-anchor="middle" font-size="12" style="fill:var(--ink-soft,#5c4334)">브라우저 안</text>
  <text x="236" y="87" text-anchor="middle" font-size="11.5" style="fill:var(--ink-mute,#8a7262)">서버에 안 물음</text>
  <rect x="288" y="40" width="210" height="58" rx="10" style="fill:var(--chip-clay-bg,#f1dccb)"/>
  <text x="302" y="63" font-weight="700">라우터 (주소 → 화면 표)</text>
  <text x="302" y="83" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">/burrow/:userId 를 찾음</text>
  <line x1="500" y1="69" x2="564" y2="69" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="532" y="61" text-anchor="middle" font-size="12" style="fill:var(--ink-soft,#5c4334)">화면 교체</text>
  <rect x="568" y="40" width="176" height="58" rx="10" style="fill:var(--chip-mint-bg,#d5e8df)"/>
  <text x="582" y="63" font-weight="700" style="fill:var(--chip-mint-fg,#2e5e4c)">땅굴 화면</text>
  <text x="582" y="83" font-size="11.5" style="fill:var(--chip-mint-fg,#2e5e4c)">그래서 멀쩡해 보임</text>

  <!-- ② 새로고침 -->
  <circle cx="27" cy="128" r="11" style="fill:var(--cta,#c8643a)"/>
  <text x="27" y="132.5" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--on-strong,#fbf4ec)">2</text>
  <text x="46" y="133" font-weight="700">새로고침 · 주소를 바로 엶 (브라우저 라우터 + 설정 없는 정적 서버)</text>
  <rect x="16" y="146" width="170" height="58" rx="10" style="fill:var(--chip-clay-bg,#f1dccb)"/>
  <text x="30" y="169" font-weight="700">새로고침</text>
  <text x="30" y="189" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">/burrow/yerin</text>
  <line x1="188" y1="175" x2="284" y2="175" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="236" y="167" text-anchor="middle" font-size="12" style="fill:var(--ink-soft,#5c4334)">그 파일을 요청</text>
  <rect x="288" y="146" width="210" height="58" rx="10" style="fill:var(--chip-sky-bg,#d9e6ec)"/>
  <text x="302" y="169" font-weight="700" style="fill:var(--chip-sky-fg,#2f5868)">정적 서버</text>
  <text x="302" y="189" font-size="11.5" style="fill:var(--chip-sky-fg,#2f5868)">있는 것: index.html, assets/</text>
  <line x1="500" y1="175" x2="564" y2="175" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="532" y="167" text-anchor="middle" font-size="12" style="fill:var(--ink-soft,#5c4334)">없음</text>
  <rect x="568" y="146" width="176" height="58" rx="10" style="fill:var(--chip-rose-bg,#f2d9d9)"/>
  <text x="582" y="169" font-weight="700" style="fill:var(--chip-rose-fg,#7d3a3f)">404</text>
  <text x="582" y="189" font-size="11.5" style="fill:var(--chip-rose-fg,#7d3a3f)">“없는 페이지”</text>

  <!-- 해결 -->
  <line x1="16" y1="230" x2="744" y2="230" style="stroke:var(--box-line,#e3cbb5)" stroke-dasharray="4 4"/>
  <rect x="16" y="220" width="64" height="22" rx="11" style="fill:var(--fig-bg,#fffaf4);stroke:var(--chip-mint-fg,#2e5e4c)"/>
  <text x="48" y="235.5" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--chip-mint-fg,#2e5e4c)">해결 둘</text>

  <!-- 실서버 -->
  <text x="16" y="270" font-weight="700">실서버: Nginx가 모르는 주소엔 index.html을 줌 (try_files)</text>
  <rect x="16" y="282" width="170" height="58" rx="10" style="fill:var(--chip-clay-bg,#f1dccb)"/>
  <text x="30" y="305" font-weight="700">새로고침</text>
  <text x="30" y="325" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">/burrow/yerin</text>
  <line x1="188" y1="311" x2="284" y2="311" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="236" y="303" text-anchor="middle" font-size="12" style="fill:var(--ink-soft,#5c4334)">그 파일을 요청</text>
  <rect x="288" y="282" width="210" height="58" rx="10" style="fill:var(--chip-sky-bg,#d9e6ec)"/>
  <text x="302" y="305" font-weight="700" style="fill:var(--chip-sky-fg,#2f5868)">Nginx</text>
  <text x="302" y="325" font-size="11.5" style="fill:var(--chip-sky-fg,#2f5868)">모르는 주소 → index.html</text>
  <text x="302" y="356" font-size="11.5" style="fill:var(--ink-mute,#8a7262)">단, 없는 /assets/* 는 404 그대로</text>
  <line x1="500" y1="311" x2="564" y2="311" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="532" y="303" text-anchor="middle" font-size="12" style="fill:var(--ink-soft,#5c4334)">돌려줌</text>
  <rect x="568" y="282" width="176" height="58" rx="10" style="fill:var(--chip-mint-bg,#d5e8df)"/>
  <text x="582" y="305" font-weight="700" style="fill:var(--chip-mint-fg,#2e5e4c)">앱이 주소를 읽음</text>
  <text x="582" y="325" font-size="11.5" style="fill:var(--chip-mint-fg,#2e5e4c)">→ 땅굴 화면</text>

  <!-- 공유본 -->
  <text x="16" y="386" font-weight="700">공유본(아티팩트): 해시 라우터. # 뒤는 서버로 가지 않음</text>
  <rect x="16" y="398" width="170" height="40" rx="10" style="fill:var(--chip-clay-bg,#f1dccb)"/>
  <text x="30" y="423" font-weight="700">/#/burrow/yerin</text>
  <line x1="188" y1="418" x2="284" y2="418" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="236" y="410" text-anchor="middle" font-size="12" style="fill:var(--ink-soft,#5c4334)">/ 만 요청</text>
  <rect x="288" y="398" width="210" height="40" rx="10" style="fill:var(--chip-sky-bg,#d9e6ec)"/>
  <text x="302" y="423" font-weight="700" style="fill:var(--chip-sky-fg,#2f5868)">정적 호스팅 → index.html</text>
  <line x1="500" y1="418" x2="564" y2="418" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="532" y="410" text-anchor="middle" font-size="12" style="fill:var(--ink-soft,#5c4334)">돌려줌</text>
  <rect x="568" y="398" width="176" height="40" rx="10" style="fill:var(--chip-mint-bg,#d5e8df)"/>
  <text x="582" y="423" font-weight="700" style="fill:var(--chip-mint-fg,#2e5e4c)">앱이 # 뒤를 읽음 → 화면</text>
</svg>
