<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="화면은 영역의 훅만 부르고, 영역 폴더의 api.ts가 환경 변수(NEXT_PUBLIC_API_MODE, NEXT_PUBLIC_API_REAL_AREAS)를 보고 영역마다 목 서버나 실제 서버를 고른다. 실제 서버 요청은 /api/v1로 가서 개발 때 Next rewrites, 배포 때 Nginx를 거쳐 백엔드로 가고, 응답 틀을 푼 DTO를 매퍼가 앱 모양으로 바꾼다" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" style="fill:var(--ink,#3e2a1f)">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink-soft,#5c4334)"/></marker>
    <marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--cta,#c8643a)"/></marker>
  </defs>
  <rect width="760" height="340" rx="14" style="fill:var(--fig-bg,#fffaf4)"/>

  <!-- 위 줄: 화면 ↔ 훅 ↔ 스위치 -->
  <rect x="16" y="20" width="100" height="60" rx="8" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
  <text x="28" y="44" font-weight="700">화면</text>
  <text x="28" y="62" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">MeetupDetail</text>
  <line x1="118" y1="50" x2="154" y2="50" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="136" y="43" text-anchor="middle" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">부름</text>
  <text x="136" y="66" text-anchor="middle" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">상태</text>

  <rect x="156" y="20" width="200" height="60" rx="8" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
  <text x="168" y="40" font-size="12.5" font-weight="700">훅 · meetups/queries.ts</text>
  <text x="168" y="57" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">받은 DTO를 mappers.ts로</text>
  <text x="168" y="72" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">앱 모양으로 바꿔 화면에</text>
  <line x1="358" y1="50" x2="388" y2="50" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="373" y="43" text-anchor="middle" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">요청</text>
  <text x="373" y="66" text-anchor="middle" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">DTO</text>

  <rect x="390" y="20" width="196" height="60" rx="8" style="fill:var(--accent-soft,#f6dccb);stroke:var(--accent,#9a4a2c)"/>
  <text x="402" y="40" font-size="12.5" font-weight="700" style="fill:var(--accent,#9a4a2c)">api/&lt;영역&gt;/api.ts</text>
  <text x="402" y="57" font-size="11.5">selectArea('meetups',</text>
  <text x="402" y="72" font-size="11.5">  real, mock)</text>

  <line x1="608" y1="50" x2="588" y2="50" style="stroke:var(--ink-mute,#8a7262)" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ah)"/>
  <rect x="610" y="14" width="134" height="72" rx="8" style="fill:none;stroke:var(--ink-mute,#8a7262)" stroke-dasharray="4 3"/>
  <text x="620" y="32" font-size="11.5" font-weight="700">NEXT_PUBLIC_API_</text>
  <text x="620" y="48" font-size="11.5" font-weight="700">MODE · REAL_AREAS</text>
  <text x="620" y="64" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">빌드할 때 정함</text>
  <text x="620" y="79" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">mock이 기본</text>

  <!-- 갈래 -->
  <polyline points="430,80 430,96 188,96 188,113" style="fill:none;stroke:var(--cta,#c8643a)" stroke-width="1.8" marker-end="url(#ahc)"/>
  <text x="300" y="91" text-anchor="middle" font-size="11.5" style="fill:var(--cta,#c8643a)">mock</text>
  <line x1="560" y1="80" x2="560" y2="113" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="568" y="101" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">real</text>

  <!-- mock 갈래 -->
  <rect x="16" y="114" width="344" height="140" rx="12" style="fill:none;stroke:var(--cta,#c8643a)" stroke-width="1.4"/>
  <text x="28" y="134" font-size="12" font-weight="700" style="fill:var(--cta,#c8643a)">mock · 기본 (백엔드가 아직 안 만든 영역)</text>
  <rect x="28" y="144" width="190" height="98" rx="8" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
  <text x="40" y="164" font-size="12.5" font-weight="700">meetups/mock.ts</text>
  <text x="40" y="182" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">명세와 같은 DTO · code</text>
  <text x="40" y="198" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">mock/server.ts: 0.15~0.4초</text>
  <text x="40" y="214" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">?api=slow · fail · empty …</text>
  <text x="40" y="230" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">로 느림 · 실패를 흉내</text>
  <line x1="218" y1="193" x2="238" y2="193" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <rect x="240" y="144" width="108" height="98" rx="8" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
  <text x="250" y="164" font-size="12.5" font-weight="700">data/*Store</text>
  <text x="250" y="182" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">메모리 저장소</text>
  <text x="250" y="198" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">(가짜 DB)</text>

  <!-- real 갈래 -->
  <rect x="388" y="114" width="356" height="140" rx="12" style="fill:none;stroke:var(--ink-mute,#8a7262)" stroke-width="1.2"/>
  <text x="400" y="134" font-size="12" font-weight="700" style="fill:var(--ink-soft,#5c4334)">real · 백엔드가 만든 영역</text>
  <rect x="400" y="144" width="150" height="98" rx="8" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
  <text x="410" y="164" font-size="12.5" font-weight="700">api/client.ts</text>
  <text x="410" y="182" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">세션 쿠키 · 10초</text>
  <text x="410" y="198" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">응답 틀을 풀어 data만</text>
  <text x="410" y="214" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">401 → 바로 로그인</text>
  <text x="410" y="230" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">GET만 재시도 2번</text>
  <line x1="550" y1="193" x2="562" y2="193" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <rect x="564" y="144" width="104" height="98" rx="8" style="fill:var(--chip-sky-bg,#d9e6ec)"/>
  <g style="fill:var(--chip-sky-fg,#2f5868)">
    <text x="572" y="164" font-size="12.5" font-weight="700">/api/v1</text>
    <text x="572" y="182" font-size="11.5">같은 출처</text>
    <text x="572" y="202" font-size="11.5">개발: Next</text>
    <text x="572" y="218" font-size="11.5">rewrites</text>
    <text x="572" y="236" font-size="11.5">배포: Nginx</text>
  </g>
  <line x1="668" y1="193" x2="680" y2="193" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <rect x="682" y="144" width="54" height="98" rx="8" style="fill:var(--chip-sky-bg,#d9e6ec)"/>
  <g style="fill:var(--chip-sky-fg,#2f5868)">
    <text x="709" y="182" text-anchor="middle" font-size="12" font-weight="700">Spring</text>
    <text x="709" y="198" text-anchor="middle" font-size="12" font-weight="700">Boot</text>
    <text x="709" y="216" text-anchor="middle" font-size="11">백엔드</text>
  </g>

  <!-- 알아 둘 것 -->
  <rect x="16" y="266" width="728" height="62" rx="8" style="fill:none;stroke:var(--ink-mute,#8a7262)" stroke-dasharray="4 4"/>
  <text x="28" y="284" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">영역 몇 개만 실제로: NEXT_PUBLIC_API_REAL_AREAS=common,auth (실시간 소식 연결은 events). 화면 코드는 그대로</text>
  <text x="28" y="301" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">백엔드 주소: API_PROXY_TARGET (기본 http://localhost:8080, next.config.ts rewrites, 빌드할 때 정해짐)</text>
  <text x="28" y="318" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">DTO는 명세 그대로(숫자 id · UTC “…Z”), 앱은 문자열 id · ms 숫자. 바꾸기는 매퍼에서 (api/common/ids.ts · lib/time.ts)</text>
</svg>
