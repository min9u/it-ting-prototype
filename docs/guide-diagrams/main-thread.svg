  <text x="439" y="306" text-anchor="middle" font-size="12" style="fill:var(--chip-clay-fg,#7e3b22)">두더지</text>
  <rect x="472" y="282" width="54" height="40" rx="6" style="fill:var(--chip-sage-bg,#dde7cc)"/>
  <text x="499" y="306" text-anchor="middle" font-size="12" style="fill:var(--chip-sage-fg,#3f5a24)">스크롤</text>
  <rect x="530" y="282" width="58" height="40" rx="6" style="fill:var(--chip-clay-bg,#f1dccb)"/>
  <text x="559" y="306" text-anchor="middle" font-size="12" style="fill:var(--chip-clay-fg,#7e3b22)">두더지</text>
  <rect x="592" y="282" width="84" height="40" rx="6" style="fill:none;stroke:var(--ink-mute,#8a7262)" stroke-dasharray="4 3"/>
  <text x="634" y="306" text-anchor="middle" font-size="12" style="fill:var(--ink-mute,#8a7262)">쉬면 멈춤</text>
  <rect x="680" y="282" width="56" height="40" rx="6" style="fill:var(--chip-sage-bg,#dde7cc)"/>
  <text x="708" y="306" text-anchor="middle" font-size="12" style="fill:var(--chip-sage-fg,#3f5a24)">키 입력</text>
  <text x="300" y="340" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">배경은 한 번 그려 두고 두더지 둘레만 · 안 움직이면 그리지 않음</text>

  <rect x="172" y="354" width="112" height="44" rx="10" style="fill:var(--fig-bg,#fffaf4);stroke:var(--box-line,#e3cbb5)"/>
  <text x="228" y="373" text-anchor="middle" font-weight="700">Worker</text>
  <text x="228" y="390" text-anchor="middle" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">옆 계산대</text>
  <rect x="300" y="358" width="236" height="36" rx="6" style="fill:var(--chip-sky-bg,#d9e6ec)"/>
  <text x="418" y="381" text-anchor="middle" font-size="12" style="fill:var(--chip-sky-fg,#2f5868)">Draco 해독 (모델 압축 풀기)</text>
  <text x="552" y="381" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">← 첫 진입 때 무거운 일</text>

  <text x="380" y="420" text-anchor="middle" font-size="12" style="fill:var(--ink-soft,#5c4334)">땅굴 걷기: 페이지 60fps · 긴 작업 0  /  첫 진입 가장 긴 멈춤 0.72 → 0.15초</text>

  <text x="380" y="458" text-anchor="middle" font-size="11.5" style="fill:var(--ink-mute,#8a7262)">막대 길이는 모양을 보여 주는 예시 (실제 시간 비율이 아님)</text>
