  <text x="110" y="45" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--chip-rose-fg,#7d3a3f)">고치기 전 · 가속 꺼짐</text>

  <text x="82" y="78" text-anchor="middle" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">줄 선 손님</text>
  <rect x="36" y="86" width="92" height="24" rx="12" style="fill:var(--fig-bg,#fffaf4);stroke:var(--box-line,#e3cbb5)"/>
  <text x="82" y="102" text-anchor="middle" font-size="12">클릭</text>
  <rect x="36" y="114" width="92" height="24" rx="12" style="fill:var(--fig-bg,#fffaf4);stroke:var(--box-line,#e3cbb5)"/>
  <text x="82" y="130" text-anchor="middle" font-size="12">스크롤</text>
