  <text x="376" y="131" text-anchor="middle" font-size="12" style="fill:var(--chip-rose-fg,#7d3a3f)">3D 그리기</text>
  <rect x="456" y="100" width="144" height="52" rx="6" style="fill:var(--chip-rose-bg,#f2d9d9)"/>
  <text x="528" y="131" text-anchor="middle" font-size="12" style="fill:var(--chip-rose-fg,#7d3a3f)">3D 그리기</text>
  <rect x="604" y="100" width="132" height="52" rx="6" style="fill:var(--chip-rose-bg,#f2d9d9)"/>
  <text x="670" y="131" text-anchor="middle" font-size="12" style="fill:var(--chip-rose-fg,#7d3a3f)">3D 그리기</text>

  <text x="380" y="183" text-anchor="middle" font-size="12" style="fill:var(--ink-soft,#5c4334)">땅굴 3fps · 탐색하기 1.1fps · 16초 중 15초 넘게 막힘 · 키를 누르고 화면까지 0.4~0.6초</text>

