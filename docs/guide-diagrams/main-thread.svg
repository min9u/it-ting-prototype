<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 472" width="760" height="472" role="img" aria-label="메인 스레드는 계산대 직원 한 명: 가속이 꺼지면 3D 그리기가 직원을 붙잡아 클릭·스크롤·키 입력이 줄을 서고, 고친 뒤에는 두더지만 짧게 그리고 해독은 Worker가 맡아 입력이 사이사이 바로 처리된다" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" style="fill:var(--ink,#3e2a1f)">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink-soft,#5c4334)"/></marker>
  </defs>
  <rect width="760" height="472" rx="14" style="fill:var(--fig-bg,#fffaf4)"/>

  <!-- ===== 고치기 전 ===== -->
