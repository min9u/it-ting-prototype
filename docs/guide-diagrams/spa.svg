<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 458" width="760" height="458" role="img" aria-label="전통 웹은 클릭마다 서버가 새 HTML 페이지를 통째로 보내지만, SPA인 디굴디굴은 처음 한 번 HTML과 JS를 받은 뒤 3D 코드는 그 화면에 처음 들어갈 때, 그다음 클릭은 데이터(JSON)만 받는다" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" style="fill:var(--ink,#3e2a1f)">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink-soft,#5c4334)"/></marker>
    <marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--cta,#c8643a)"/></marker>
  </defs>
  <rect width="760" height="458" rx="14" style="fill:var(--fig-bg,#fffaf4)"/>

  <!-- 칸 이름 -->
  <text x="136" y="24" text-anchor="middle" font-weight="700" style="fill:var(--ink-mute,#8a7262)">브라우저</text>
  <text x="624" y="24" text-anchor="middle" font-weight="700" style="fill:var(--ink-mute,#8a7262)">서버</text>

  <!-- 전통 웹 -->
  <rect x="16" y="36" width="230" height="26" rx="13" style="fill:var(--chip-sand-bg,#eadfc6)"/>
  <text x="30" y="54" font-weight="700" style="fill:var(--chip-sand-fg,#5e4a1e)">전통 웹: 클릭마다 새 페이지</text>
  <rect x="16" y="72" width="240" height="40" rx="8" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
  <text x="30" y="97">게시판 링크 클릭</text>
  <rect x="16" y="120" width="240" height="40" rx="8" style="fill:var(--chip-rose-bg,#f2d9d9)"/>
  <text x="30" y="145" style="fill:var(--chip-rose-fg,#7d3a3f)">화면 전체가 지워졌다가 다시 뜸</text>
  <rect x="504" y="72" width="240" height="88" rx="8" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
  <text x="518" y="108" font-weight="700">새 HTML 페이지를 통째로 만듦</text>
  <text x="518" y="128" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">헤더까지 전부 다시</text>
  <text x="380" y="86" text-anchor="middle" font-size="12" style="fill:var(--ink-soft,#5c4334)">GET /board (페이지 주세요)</text>
  <line x1="258" y1="92" x2="500" y2="92" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="380" y="134" text-anchor="middle" font-size="12" style="fill:var(--ink-soft,#5c4334)">HTML · CSS · JS 전부</text>
  <line x1="500" y1="140" x2="258" y2="140" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- SPA -->
  <rect x="16" y="178" width="372" height="26" rx="13" style="fill:var(--accent-soft,#f6dccb)"/>
  <text x="30" y="196" font-weight="700" style="fill:var(--accent,#9a4a2c)">SPA (디굴디굴): HTML은 처음 한 번, 그다음은 데이터만</text>

  <!-- ① 처음 접속 -->
  <rect x="16" y="214" width="240" height="48" rx="8" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
  <circle cx="34" cy="232" r="10" style="fill:var(--cta,#c8643a)"/>
  <text x="34" y="236.5" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--on-strong,#fbf4ec)">1</text>
  <text x="52" y="236" font-weight="700">처음 접속</text>
  <text x="52" y="254" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">index.html은 빈 div#root 하나</text>
  <text x="380" y="231" text-anchor="middle" font-size="12" style="fill:var(--ink-soft,#5c4334)">HTML 한 장 + 화면 JS 묶음</text>
  <line x1="500" y1="238" x2="258" y2="238" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- ② 땅굴 -->
  <rect x="16" y="270" width="240" height="48" rx="8" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
  <circle cx="34" cy="288" r="10" style="fill:var(--cta,#c8643a)"/>
  <text x="34" y="292.5" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--on-strong,#fbf4ec)">2</text>
  <text x="52" y="292" font-weight="700">내 땅굴(/burrow) 들어감</text>
  <text x="52" y="310" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">그때 처음 3D 코드를 받음 (lazy)</text>
  <text x="380" y="287" text-anchor="middle" font-size="12" style="fill:var(--ink-soft,#5c4334)">3D 청크 (three.js · 장면 코드)</text>
  <line x1="500" y1="294" x2="258" y2="294" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="504" y="214" width="240" height="104" rx="8" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
  <text x="518" y="258" font-weight="700">정적 파일</text>
  <text x="518" y="278" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">index.html · assets/*.js</text>

  <!-- ③ 게시판 -->
  <rect x="16" y="326" width="240" height="60" rx="8" style="fill:var(--box,#f4e6d8);stroke:var(--cta,#c8643a)" stroke-width="1.5"/>
  <circle cx="34" cy="344" r="10" style="fill:var(--cta,#c8643a)"/>
  <text x="34" y="348.5" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--on-strong,#fbf4ec)">3</text>
  <text x="52" y="348" font-weight="700">게시판 메뉴 클릭</text>
  <text x="52" y="368" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">JS가 안쪽만 바꿈, 헤더는 그대로</text>
  <text x="380" y="337" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--cta,#c8643a)">GET /api/posts</text>
  <line x1="258" y1="344" x2="500" y2="344" style="stroke:var(--cta,#c8643a)" stroke-width="1.8" marker-end="url(#ahc)"/>
  <line x1="500" y1="366" x2="258" y2="366" style="stroke:var(--cta,#c8643a)" stroke-width="1.8" marker-end="url(#ahc)"/>
  <text x="380" y="382" text-anchor="middle" font-size="12" style="fill:var(--cta,#c8643a)">JSON: 글 목록 데이터만</text>
  <rect x="504" y="326" width="240" height="60" rx="8" style="fill:var(--chip-sky-bg,#d9e6ec)"/>
  <text x="518" y="350" font-weight="700" style="fill:var(--chip-sky-fg,#2f5868)">API 서버 (/api)</text>
  <text x="518" y="370" font-size="11.5" style="fill:var(--chip-sky-fg,#2f5868)">지금은 목 서버(가짜 서버)</text>

  <!-- ④ 다시 땅굴 -->
  <rect x="16" y="394" width="240" height="48" rx="8" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
  <circle cx="34" cy="412" r="10" style="fill:var(--cta,#c8643a)"/>
  <text x="34" y="416.5" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--on-strong,#fbf4ec)">4</text>
  <text x="52" y="416" font-weight="700">다시 땅굴로</text>
  <text x="52" y="434" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">3D 코드는 이미 받아 둠</text>
  <text x="380" y="422" text-anchor="middle" font-size="12" style="fill:var(--ink-mute,#8a7262)">서버에 HTML을 다시 묻지 않음</text>
</svg>
