<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 432" width="760" height="432" role="img" aria-label="기획 변경은 문구 하나, 규칙 하나, 데이터 칸 하나, 화면 흐름 하나 순서로 손대는 곳이 늘어나고, 데이터 칸부터는 백엔드와 같이 바꿔야 한다" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" style="fill:var(--ink,#3e2a1f)">
  <rect width="760" height="432" rx="14" style="fill:var(--fig-bg,#fffaf4)"/>

  <!-- 머리 -->
  <text x="24" y="44" font-weight="700">바뀌는 것 · 이 프로젝트의 예</text>
  <g font-size="11.5" text-anchor="middle" style="fill:var(--ink-soft,#5c4334)">
    <text x="303" y="34">화면</text><text x="303" y="50">문구 · 모양</text>
    <text x="361" y="34">규칙 함수</text><text x="361" y="50">· 테스트</text>
    <text x="419" y="34">타입</text><text x="419" y="50">· 매퍼</text>
    <text x="477" y="34">API 계약</text><text x="477" y="50">· 백엔드</text>
    <text x="535" y="34">라우트 ·</text><text x="535" y="50">여러 화면</text>
    <text x="593" y="34">디자인</text><text x="593" y="50">확인</text>
  </g>
  <text x="684" y="44" text-anchor="middle" font-size="11.5" font-weight="700" style="fill:var(--ink-soft,#5c4334)">크기 감각</text>
  <line x1="16" y1="62" x2="744" y2="62" style="stroke:var(--box-line,#e3cbb5)" stroke-width="1.3"/>

  <!-- 줄 바탕 -->
  <rect x="16" y="66" width="728" height="74" rx="8" style="fill:var(--box,#f4e6d8)"/>
  <rect x="16" y="222" width="728" height="74" rx="8" style="fill:var(--box,#f4e6d8)"/>

  <!-- 1 문구 하나 -->
  <text x="24" y="88" font-weight="700">문구 하나</text>
  <g font-size="11.5" style="fill:var(--ink-soft,#5c4334)">
    <text x="24" y="107">예: 토스트 “찜한 모임에 담았어요”</text>
    <text x="24" y="124">→ 모임 상세 · 목록 두 화면에 따로 있음</text>
  </g>
  <!-- 2 규칙 하나 -->
  <text x="24" y="164" font-weight="700">규칙 하나</text>
  <g font-size="11.5" style="fill:var(--ink-soft,#5c4334)">
    <text x="24" y="182">예: 방명록 100 → 50자</text>
    <text x="24" y="198">→ 규칙은 lib/validation.ts 한 곳</text>
    <text x="24" y="214" style="fill:var(--ink-mute,#8a7262)">확인: 서버 검사 · ERD · Figma 옛 프레임</text>
  </g>
  <!-- 3 데이터 칸 하나 -->
  <text x="24" y="244" font-weight="700">데이터 칸 하나</text>
  <g font-size="11.5" style="fill:var(--ink-soft,#5c4334)">
    <text x="24" y="263">예: 모임 관심사 태그 (최대 3개)</text>
    <text x="24" y="280">→ 화면엔 있는데 ERD에 칸이 없음 (Q3)</text>
  </g>
  <!-- 4 화면 흐름 하나 -->
  <text x="24" y="322" font-weight="700">화면 흐름 하나</text>
  <g font-size="11.5" style="fill:var(--ink-soft,#5c4334)">
    <text x="24" y="341">예: 로그인 검사 켜기 (LOGIN_FREE 끄기)</text>
    <text x="24" y="358">→ 임시 사용자 ME_ID 대신 로그인한 사람</text>
    <text x="24" y="375" style="fill:var(--ink-mute,#8a7262)">ME_ID가 나오는 파일 26개 (11-17 기준)</text>
  </g>

  <!-- 점: 채운 점 = 손댐, 빈 점 = 확인 -->
  <g style="fill:var(--accent,#9a4a2c)">
    <!-- 1 -->
    <circle cx="303" cy="103" r="7"/>
    <!-- 2 -->
    <circle cx="303" cy="181" r="7"/>
    <circle cx="361" cy="181" r="7"/>
    <!-- 3 -->
    <circle cx="303" cy="259" r="7"/>
    <circle cx="419" cy="259" r="7"/>
    <circle cx="477" cy="259" r="7"/>
    <!-- 4 -->
    <circle cx="303" cy="337" r="7"/>
    <circle cx="477" cy="337" r="7"/>
    <circle cx="535" cy="337" r="7"/>
  </g>
  <g style="fill:none;stroke:var(--accent,#9a4a2c)" stroke-width="1.6">
    <!-- 1 -->
    <circle cx="535" cy="103" r="6.2"/>
    <circle cx="593" cy="103" r="6.2"/>
    <!-- 2 -->
    <circle cx="477" cy="181" r="6.2"/>
    <circle cx="593" cy="181" r="6.2"/>
    <!-- 3 -->
    <circle cx="361" cy="259" r="6.2"/>
    <circle cx="593" cy="259" r="6.2"/>
    <!-- 4 -->
    <circle cx="361" cy="337" r="6.2"/>
    <circle cx="419" cy="337" r="6.2"/>
    <circle cx="593" cy="337" r="6.2"/>
  </g>

  <!-- 크기 감각 -->
  <g style="fill:var(--cta,#c8643a)">
    <rect x="636" y="97" width="18" height="12" rx="3"/>
    <rect x="636" y="175" width="44" height="12" rx="3"/>
    <rect x="636" y="253" width="72" height="12" rx="3"/>
    <rect x="636" y="331" width="100" height="12" rx="3"/>
  </g>
  <g font-size="11.5" style="fill:var(--ink-soft,#5c4334)">
    <text x="636" y="128">작음</text>
    <text x="636" y="206">중간</text>
    <text x="636" y="284">큼 · 백엔드와 같이</text>
    <text x="636" y="362">가장 큼 · 여러 화면</text>
  </g>

  <!-- 범례 -->
  <line x1="16" y1="392" x2="744" y2="392" style="stroke:var(--box-line,#e3cbb5)" stroke-width="1"/>
  <circle cx="30" cy="412" r="7" style="fill:var(--accent,#9a4a2c)"/>
  <text x="44" y="416" font-size="12">손댐</text>
  <circle cx="92" cy="412" r="6.2" style="fill:none;stroke:var(--accent,#9a4a2c)" stroke-width="1.6"/>
  <text x="106" y="416" font-size="12">확인만</text>
  <text x="160" y="416" font-size="12" style="fill:var(--ink-soft,#5c4334)">빈칸 = 거의 없음 · 감각용, 시간 측정 아님 · 같은 것이 여러 곳에 흩어져 있으면 한 단계 커진다</text>
</svg>
