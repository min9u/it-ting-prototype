<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" width="760" height="392" role="img" aria-label="단위 테스트는 함수 하나를 좁고 깊게, 스모크는 96개 화면을 세 가지 그래픽 모드로 넓고 얕게 본다. CI는 올릴 때마다 설치부터 스모크까지 일곱 단계를 차례로 돈다" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" style="fill:var(--ink,#3e2a1f)">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink-soft,#5c4334)"/></marker>
  </defs>
  <rect width="760" height="392" rx="14" style="fill:var(--fig-bg,#fffaf4)"/>

  <!-- 단위 테스트 -->
  <rect x="16" y="16" width="356" height="208" rx="12" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
  <rect x="28" y="28" width="160" height="26" rx="13" style="fill:var(--chip-sage-bg,#dde7cc)"/>
  <text x="108" y="46" text-anchor="middle" font-weight="700" style="fill:var(--chip-sage-fg,#3f5a24)">단위 테스트 (vitest)</text>
  <text x="200" y="46" font-size="11.5" style="fill:var(--ink-mute,#8a7262)">좁고 깊게</text>
  <text x="30" y="86" font-size="24" font-weight="700">166개</text>
  <text x="110" y="85" font-size="12" style="fill:var(--ink-soft,#5c4334)">통과 163 · 할 일 3 · 약 9초</text>
  <text x="30" y="114">함수 하나에 입력을 넣고 답이 맞나</text>
  <text x="30" y="134" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">화면 없이 돎. 시간대는 서울로 고정</text>
  <rect x="28" y="148" width="332" height="44" rx="8" style="fill:var(--fig-bg,#fffaf4);stroke:var(--box-line,#e3cbb5)"/>
  <text x="40" y="166" font-size="11.5" style="fill:var(--ink-mute,#8a7262)">테스트 이름에 명세 번호</text>
  <text x="40" y="184" font-size="12">“M7 마감 일시가 지나면 … 자동 미승인”</text>
  <text x="30" y="212" font-size="11.5" font-family="'Nanum Gothic Coding','D2Coding',Consolas,monospace" style="fill:var(--ink-soft,#5c4334)">app/src/tests/ <tspan font-family="'Noto Sans KR','Malgun Gothic',sans-serif">파일 7개</tspan></text>

  <!-- 스모크 -->
  <rect x="388" y="16" width="356" height="208" rx="12" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
  <rect x="400" y="28" width="160" height="26" rx="13" style="fill:var(--chip-sky-bg,#d9e6ec)"/>
  <text x="480" y="46" text-anchor="middle" font-weight="700" style="fill:var(--chip-sky-fg,#2f5868)">스모크 (smoke.mjs)</text>
  <text x="572" y="46" font-size="11.5" style="fill:var(--ink-mute,#8a7262)">넓고 얕게</text>
  <text x="402" y="86" font-size="24" font-weight="700">96개 화면</text>
  <text x="518" y="85" font-size="12" style="fill:var(--ink-soft,#5c4334)">× 가속 켬 · 끔 · WebGL 없음</text>
  <text x="402" y="114">빌드한 앱을 헤드리스 크롬으로 하나씩 열기</text>
  <text x="402" y="134" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">열리는지만 봄 (기능이 맞는지는 안 봄)</text>
  <rect x="400" y="148" width="332" height="44" rx="8" style="fill:var(--fig-bg,#fffaf4);stroke:var(--box-line,#e3cbb5)"/>
  <text x="412" y="166" font-size="11.5" style="fill:var(--ink-mute,#8a7262)">잡는 것</text>
  <text x="412" y="184" font-size="12">예외 · 콘솔 에러 · 리소스 실패 · 빈 화면 · 오류 화면 · WebGL</text>
  <rect x="400" y="198" width="190" height="20" rx="10" style="fill:var(--chip-mint-bg,#d5e8df)"/>
  <text x="495" y="212" text-anchor="middle" font-size="11.5" style="fill:var(--chip-mint-fg,#2e5e4c)">11-17: 세 모드 모두 96 / 96 OK</text>

  <!-- CI -->
  <text x="16" y="256" font-weight="700">CI (.github/workflows/ci.yml): main에 올릴 때 · PR마다 차례로</text>
  <rect x="574" y="241" width="170" height="22" rx="11" style="fill:var(--chip-butter-bg,#f3e6be)"/>
  <text x="659" y="256.5" text-anchor="middle" font-size="11.5" style="fill:var(--chip-butter-fg,#6b5410)">GitHub에서는 아직 안 돌려 봄</text>

  <g font-size="12" text-anchor="middle">
    <rect x="18" y="282" width="94" height="52" rx="8" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
    <text x="65" y="303" font-weight="700">설치</text>
    <text x="65" y="322" font-size="11" font-family="'Nanum Gothic Coding','D2Coding',Consolas,monospace" style="fill:var(--ink-soft,#5c4334)">npm ci</text>
    <line x1="113" y1="308" x2="122" y2="308" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.4" marker-end="url(#ah)"/>

    <rect x="123" y="282" width="94" height="52" rx="8" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
    <text x="170" y="303" font-weight="700">타입 검사</text>
    <text x="170" y="322" font-size="11" font-family="'Nanum Gothic Coding','D2Coding',Consolas,monospace" style="fill:var(--ink-soft,#5c4334)">tsc -b</text>
    <line x1="218" y1="308" x2="227" y2="308" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.4" marker-end="url(#ah)"/>

    <rect x="228" y="282" width="94" height="52" rx="8" style="fill:var(--chip-sage-bg,#dde7cc)"/>
    <text x="275" y="303" font-weight="700" style="fill:var(--chip-sage-fg,#3f5a24)">단위 테스트</text>
    <text x="275" y="322" font-size="11" font-family="'Nanum Gothic Coding','D2Coding',Consolas,monospace" style="fill:var(--chip-sage-fg,#3f5a24)">npm test</text>
    <line x1="323" y1="308" x2="332" y2="308" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.4" marker-end="url(#ah)"/>

    <rect x="333" y="282" width="94" height="52" rx="8" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
    <text x="380" y="303" font-weight="700">빌드</text>
    <text x="380" y="322" font-size="11" font-family="'Nanum Gothic Coding','D2Coding',Consolas,monospace" style="fill:var(--ink-soft,#5c4334)">vite build</text>
    <line x1="428" y1="308" x2="437" y2="308" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.4" marker-end="url(#ah)"/>

    <rect x="438" y="282" width="94" height="52" rx="8" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
    <text x="485" y="303" font-weight="700">번들 크기</text>
    <text x="485" y="322" font-size="11" font-family="'Nanum Gothic Coding','D2Coding',Consolas,monospace" style="fill:var(--ink-soft,#5c4334)">bundle-report</text>
    <line x1="533" y1="308" x2="542" y2="308" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.4" marker-end="url(#ah)"/>

    <rect x="543" y="282" width="94" height="52" rx="8" style="fill:var(--chip-sky-bg,#d9e6ec)"/>
    <text x="590" y="303" font-weight="700" style="fill:var(--chip-sky-fg,#2f5868)">스모크</text>
    <text x="590" y="322" font-size="11" font-family="'Nanum Gothic Coding','D2Coding',Consolas,monospace" style="fill:var(--chip-sky-fg,#2f5868)">SwiftShader</text>
    <line x1="638" y1="308" x2="647" y2="308" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.4" marker-end="url(#ah)"/>

    <rect x="648" y="282" width="94" height="52" rx="8" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
    <text x="695" y="303" font-weight="700">결과 올리기</text>
    <text x="695" y="322" font-size="11" style="fill:var(--ink-soft,#5c4334)">스크린샷 · 보고서</text>
  </g>

  <text x="16" y="360" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">러너: ubuntu-24.04, 서울 시간대(TZ=Asia/Seoul). 그래픽카드가 없어 스모크는 SwiftShader(CPU)로 WebGL을 그림</text>
  <text x="16" y="378" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">실패하면 다음 단계로 가지 않음. 번들 크기는 예산을 넘어도 경고만, 결과 올리기는 실패해도 늘 함</text>
</svg>
