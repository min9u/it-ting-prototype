<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" width="760" height="392" role="img" aria-label="디자인 시안은 정상 화면 한 장이지만, 그 밑에는 기다림·실패, 연결 끊김, 기기 차이, 접근성처럼 화면마다 같이 만들어야 하는 일이 숨어 있다" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" style="fill:var(--ink,#3e2a1f)">
  <rect width="760" height="392" rx="14" style="fill:var(--fig-bg,#fffaf4)"/>
  <!-- 물 -->
  <path d="M 0 110 H 760 V 378 A 14 14 0 0 1 746 392 H 14 A 14 14 0 0 1 0 378 Z" style="fill:var(--chip-sky-bg,#d9e6ec)"/>
  <line x1="0" y1="110" x2="760" y2="110" style="stroke:var(--chip-sky-fg,#2f5868)" stroke-width="1.4"/>

  <!-- 물 위: 시안 -->
  <polygon points="318,110 344,64 378,38 414,48 440,80 458,110" style="fill:var(--box,#f4e6d8);stroke:var(--ink-mute,#8a7262)" stroke-width="1.3"/>
  <text x="388" y="94" text-anchor="middle" font-size="12" font-weight="700">시안</text>
  <text x="482" y="54" font-weight="700">물 위: 디자인 시안 = 정상 화면 1장</text>
  <text x="482" y="74" font-size="12" style="fill:var(--ink-soft,#5c4334)">기획 · 디자인 회의에서 보이는 부분</text>

  <!-- 물 밑: 얼음 -->
  <polygon points="250,110 520,110 700,124 744,180 746,262 700,314 520,334 260,336 80,320 16,264 16,180 70,124" style="fill:var(--box,#f4e6d8);stroke:var(--ink-mute,#8a7262)" stroke-width="1.3"/>

  <text x="380" y="136" text-anchor="middle" font-weight="700">물 밑: 화면마다 같이 만드는 것 (모두 지금 앱에 있음)</text>
  <g font-size="12.5" font-weight="700" style="fill:var(--accent,#9a4a2c)">
    <text x="56" y="160">기다리고 실패할 때</text>
    <text x="226" y="160">연결이 흔들릴 때</text>
    <text x="396" y="160">기기가 다를 때</text>
    <text x="566" y="160">누구나 쓰게</text>
  </g>
  <g font-size="12">
    <text x="56" y="184">· 불러오는 중 → 스켈레톤</text>
    <text x="56" y="205">· 오류 → 다시 시도</text>
    <text x="56" y="226">· 비어 있음 → 빈 상태</text>
    <text x="56" y="247">· 없음(404) → 없음 안내</text>
    <text x="56" y="268">· 쓰기 실패 → 되돌림</text>
    <text x="66" y="286" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">+ 빨간 토스트</text>

    <text x="226" y="184">· 오프라인 → 맨 위 띠</text>
    <text x="226" y="205">· 채팅 끊김 → 다시 연결</text>
    <text x="226" y="226">· 못 보낸 메시지</text>
    <text x="236" y="244" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">→ 다시 보내기</text>
    <text x="226" y="265">· 옛 탭 (청크 404)</text>
    <text x="236" y="283" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">→ 한 번 새로고침</text>

    <text x="396" y="184">· WebGL 없음 → 정지 그림</text>
    <text x="396" y="205">· 3D 도중 실패 → 다시 만듦</text>
    <text x="396" y="226">· 가속 꺼진 PC → 저사양</text>
    <text x="406" y="244" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">+ 안내 띠</text>
    <text x="396" y="265">· 휴대폰 → “PC에서</text>
    <text x="406" y="283" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">이용해 주세요”</text>

    <text x="566" y="184">· 키보드만으로 쓰기</text>
    <text x="566" y="205">· 팝업 초점 가두기 · 복귀</text>
    <text x="566" y="226">· 글자 수 검사 (n / 최대)</text>
    <text x="566" y="247">· 움직임 줄이기 설정</text>
  </g>

  <text x="380" y="366" text-anchor="middle" font-size="12.5" style="fill:var(--chip-sky-fg,#2f5868)">화면 하나를 만든다 = 물 위 1장 + 물 밑의 일까지</text>
</svg>
