<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 412" width="760" height="412" role="img" aria-label="내 땅굴 화면 MyBurrow는 패널이 열렸는지만 state로 기억하고 방 위치 focusX는 계산해서 props로 RoomView에 내려보내며, 패널의 접기 버튼은 함수로 위에 알린다" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" style="fill:var(--ink,#3e2a1f)">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink-soft,#5c4334)"/></marker>
    <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--accent,#9a4a2c)"/></marker>
    <marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--cta,#c8643a)"/></marker>
  </defs>
  <rect width="760" height="412" rx="14" style="fill:var(--fig-bg,#fffaf4)"/>

  <!-- 주소 -->
  <rect x="16" y="16" width="200" height="30" rx="15" style="fill:var(--chip-clay-bg,#f1dccb)"/>
  <text x="116" y="36" text-anchor="middle" font-size="12" font-family="'Nanum Gothic Coding',Consolas,monospace" style="fill:var(--chip-clay-fg,#7e3b22)">/burrow?panel=closed</text>
  <line x1="116" y1="46" x2="116" y2="70" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="126" y="63" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">처음 값만 읽음</text>

  <!-- MyBurrow -->
  <rect x="16" y="74" width="440" height="128" rx="12" style="fill:var(--box,#f4e6d8);stroke:var(--strong,#6b4a3a)" stroke-width="1.6"/>
  <text x="30" y="98" font-weight="700">MyBurrow</text>
  <text x="108" y="98" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">내 땅굴 화면 (screens/burrow/MyBurrow.tsx)</text>
  <rect x="30" y="112" width="54" height="24" rx="12" style="fill:var(--chip-butter-bg,#f3e6be)"/>
  <text x="57" y="128.5" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--chip-butter-fg,#6b5410)">state</text>
  <text x="94" y="129" font-size="12.5" font-family="'Nanum Gothic Coding',Consolas,monospace" style="fill:var(--accent,#9a4a2c)">panelOpen</text>
  <text x="178" y="129" font-size="12" style="fill:var(--ink-soft,#5c4334)">패널이 열렸나 (기억하는 값)</text>
  <rect x="30" y="148" width="54" height="24" rx="12" style="fill:var(--chip-sage-bg,#dde7cc)"/>
  <text x="57" y="164.5" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--chip-sage-fg,#3f5a24)">계산</text>
  <text x="94" y="165" font-size="12.5" font-family="'Nanum Gothic Coding',Consolas,monospace" style="fill:var(--accent,#9a4a2c)">focusX = 패널 보임 ? 0.403 : 0.5</text>
  <text x="94" y="188" font-size="11.5" style="fill:var(--ink-mute,#8a7262)">state 가 아님. 다시 그릴 때마다 계산</text>

  <!-- 아래로 props -->
  <line x1="196" y1="204" x2="196" y2="252" style="stroke:var(--accent,#9a4a2c)" stroke-width="1.8" marker-end="url(#aha)"/>
  <text x="186" y="226" text-anchor="end" font-size="12" font-weight="700" style="fill:var(--accent,#9a4a2c)">props: focusX</text>
  <text x="186" y="243" text-anchor="end" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">데이터는 아래로</text>

  <!-- 위로 함수 -->
  <line x1="272" y1="254" x2="272" y2="206" style="stroke:var(--cta,#c8643a)" stroke-width="1.8" marker-end="url(#ahc)"/>
  <text x="282" y="226" font-size="12" font-weight="700" style="fill:var(--cta,#c8643a)">함수: setPanelOpen(false)</text>
  <text x="282" y="243" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">알림은 위로</text>

  <!-- 자식 -->
  <rect x="16" y="256" width="210" height="64" rx="10" style="fill:var(--fig-bg,#fffaf4);stroke:var(--box-line,#e3cbb5)"/>
  <text x="30" y="280" font-weight="700">RoomView</text>
  <text x="30" y="300" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">focusX 를 받기만 함 (3D 틀)</text>
  <rect x="246" y="256" width="210" height="64" rx="10" style="fill:var(--fig-bg,#fffaf4);stroke:var(--box-line,#e3cbb5)"/>
  <text x="260" y="280" font-weight="700">내 정보 패널</text>
  <rect x="374" y="266" width="70" height="24" rx="12" style="fill:var(--chip-clay-bg,#f1dccb)"/>
  <text x="409" y="282.5" text-anchor="middle" font-size="12" style="fill:var(--chip-clay-fg,#7e3b22)">접기 ›</text>
  <text x="260" y="300" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">버튼을 누르면 위에 알림</text>

  <!-- 3D -->
  <line x1="121" y1="322" x2="121" y2="346" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="131" y="339" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">손잡이 setFocusX</text>
  <rect x="16" y="350" width="210" height="46" rx="10" style="fill:var(--chip-sky-bg,#d9e6ec)"/>
  <text x="30" y="370" font-weight="700" style="fill:var(--chip-sky-fg,#2f5868)">3D 장면</text>
  <text x="30" y="387" font-size="11.5" style="fill:var(--chip-sky-fg,#2f5868)">카메라 화면을 옆으로 밀어 그림</text>

  <!-- 오른쪽: focusX 가 바꾸는 것 -->
  <text x="492" y="36" font-weight="700">focusX 가 바꾸는 것</text>
  <text x="492" y="66" font-size="12" style="fill:var(--ink-soft,#5c4334)">패널 열림 → 0.403</text>
  <rect x="492" y="76" width="240" height="100" rx="8" style="fill:var(--chip-sand-bg,#eadfc6)"/>
  <line x1="612" y1="76" x2="612" y2="176" style="stroke:var(--ink-mute,#8a7262)" stroke-dasharray="3 3"/>
  <circle cx="589" cy="128" r="32" style="fill:var(--chip-clay-bg,#f1dccb);stroke:var(--chip-clay-fg,#7e3b22)"/>
  <text x="589" y="132" text-anchor="middle" font-size="12" style="fill:var(--chip-clay-fg,#7e3b22)">방</text>
  <rect x="668" y="84" width="58" height="84" rx="6" style="fill:var(--fig-bg,#fffaf4);stroke:var(--box-line,#e3cbb5)"/>
  <text x="697" y="131" text-anchor="middle" font-size="12" style="fill:var(--ink-soft,#5c4334)">패널</text>

  <text x="492" y="210" font-size="12" style="fill:var(--ink-soft,#5c4334)">패널 닫힘 → 0.5 (가운데)</text>
  <rect x="492" y="220" width="240" height="100" rx="8" style="fill:var(--chip-sand-bg,#eadfc6)"/>
  <line x1="612" y1="220" x2="612" y2="320" style="stroke:var(--ink-mute,#8a7262)" stroke-dasharray="3 3"/>
  <circle cx="612" cy="272" r="32" style="fill:var(--chip-clay-bg,#f1dccb);stroke:var(--chip-clay-fg,#7e3b22)"/>
  <text x="612" y="276" text-anchor="middle" font-size="12" style="fill:var(--chip-clay-fg,#7e3b22)">방</text>

  <text x="492" y="350" font-size="12" font-weight="700">state 는 최소로, 나머지는 계산</text>
  <text x="492" y="370" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">같은 정보를 두 곳에 두면 어긋남</text>
  <text x="492" y="388" font-size="11.5" style="fill:var(--ink-mute,#8a7262)">점선 = 화면 가운데</text>
</svg>
