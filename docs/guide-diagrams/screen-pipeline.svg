<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" width="760" height="372" role="img" aria-label="화면 하나는 기획 명세와 디자인을 받아 조각 나누기, 데이터 연결, 상태 4개, 검사, 배포 순서로 만들어지고, 다른 곳은 질문으로, 검사가 깨지면 고쳐서 되돌아간다" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" style="fill:var(--ink,#3e2a1f)">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink-soft,#5c4334)"/></marker>
    <marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--cta,#c8643a)"/></marker>
  </defs>
  <rect width="760" height="372" rx="14" style="fill:var(--fig-bg,#fffaf4)"/>

  <!-- 넘겨주는 사람 -->
  <rect x="34" y="16" width="68" height="26" rx="13" style="fill:var(--chip-butter-bg,#f3e6be)"/>
  <text x="68" y="34" text-anchor="middle" font-size="12.5" font-weight="700" style="fill:var(--chip-butter-fg,#6b5410)">기획자</text>
  <rect x="134" y="16" width="76" height="26" rx="13" style="fill:var(--chip-rose-bg,#f2d9d9)"/>
  <text x="172" y="34" text-anchor="middle" font-size="12.5" font-weight="700" style="fill:var(--chip-rose-fg,#7d3a3f)">디자이너</text>
  <rect x="346" y="16" width="68" height="26" rx="13" style="fill:var(--chip-sky-bg,#d9e6ec)"/>
  <text x="380" y="34" text-anchor="middle" font-size="12.5" font-weight="700" style="fill:var(--chip-sky-fg,#2f5868)">백엔드</text>

  <line x1="68" y1="44" x2="68" y2="92" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="74" y="72" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">명세</text>
  <line x1="172" y1="44" x2="172" y2="92" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="178" y="72" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">시안</text>
  <line x1="380" y1="44" x2="380" y2="92" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="386" y="72" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">API 계약</text>

  <!-- 단계 사이 화살표 -->
  <g style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6">
    <line x1="88" y1="110" x2="150" y2="110" marker-end="url(#ah)"/>
    <line x1="192" y1="110" x2="254" y2="110" marker-end="url(#ah)"/>
    <line x1="296" y1="110" x2="358" y2="110" marker-end="url(#ah)"/>
    <line x1="400" y1="110" x2="462" y2="110" marker-end="url(#ah)"/>
    <line x1="504" y1="110" x2="566" y2="110" marker-end="url(#ah)"/>
    <line x1="608" y1="110" x2="670" y2="110" marker-end="url(#ah)"/>
  </g>

  <!-- 번호: 1·2 는 받는 것, 3~7 은 프론트엔드가 하는 일 -->
  <g font-weight="700" text-anchor="middle">
    <circle cx="68" cy="110" r="16" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
    <text x="68" y="115">1</text>
    <circle cx="172" cy="110" r="16" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
    <text x="172" y="115">2</text>
    <circle cx="276" cy="110" r="16" style="fill:var(--cta,#c8643a)"/>
    <text x="276" y="115" style="fill:var(--on-strong,#fbf4ec)">3</text>
    <circle cx="380" cy="110" r="16" style="fill:var(--cta,#c8643a)"/>
    <text x="380" y="115" style="fill:var(--on-strong,#fbf4ec)">4</text>
    <circle cx="484" cy="110" r="16" style="fill:var(--cta,#c8643a)"/>
    <text x="484" y="115" style="fill:var(--on-strong,#fbf4ec)">5</text>
    <circle cx="588" cy="110" r="16" style="fill:var(--cta,#c8643a)"/>
    <text x="588" y="115" style="fill:var(--on-strong,#fbf4ec)">6</text>
    <circle cx="692" cy="110" r="16" style="fill:var(--cta,#c8643a)"/>
    <text x="692" y="115" style="fill:var(--on-strong,#fbf4ec)">7</text>
  </g>

  <!-- 단계 이름과 내용 -->
  <g text-anchor="middle">
    <g font-weight="700">
      <text x="68" y="150">기획 명세</text>
      <text x="172" y="150">디자인</text>
      <text x="276" y="150">조각 나누기</text>
      <text x="380" y="150">데이터 연결</text>
      <text x="484" y="150">상태 4개</text>
      <text x="588" y="150">검사</text>
      <text x="692" y="150">배포</text>
    </g>
    <g font-size="11.5" style="fill:var(--ink-soft,#5c4334)">
      <text x="68" y="170">Figma 02</text>
      <text x="68" y="187">F1~F11 · 공통</text>
      <text x="68" y="204">규칙 · 문구 · 흐름</text>

      <text x="172" y="170">Figma 03</text>
      <text x="172" y="187">화면 시안</text>
      <text x="172" y="204">색 · 글자 크기</text>

      <text x="276" y="170">공용 조각</text>
      <text x="276" y="187">components/</text>
      <text x="276" y="204">화면 screens/</text>

      <text x="380" y="170">화면 → 훅</text>
      <text x="380" y="187">→ API 함수</text>
      <text x="380" y="204">→ 목 / 실제 서버</text>

      <text x="484" y="170">불러오는 중</text>
      <text x="484" y="187">오류 · 없음</text>
      <text x="484" y="204">정상</text>

      <text x="588" y="170">타입 검사 tsc</text>
      <text x="588" y="187">단위 테스트 166</text>
      <text x="588" y="204">스모크 96 화면</text>

      <text x="692" y="170">공유 빌드</text>
      <text x="692" y="187">→ 아티팩트</text>
      <text x="692" y="204">일반 빌드</text>
      <text x="692" y="221">→ 실서버 (가정)</text>
    </g>
  </g>

  <!-- 묶음 -->
  <path d="M 22 236 V 244 H 218 V 236" style="fill:none;stroke:var(--ink-mute,#8a7262)" stroke-width="1.3"/>
  <text x="120" y="262" text-anchor="middle" font-size="12" style="fill:var(--ink-mute,#8a7262)">기획 · 디자인에서 받음</text>
  <path d="M 230 236 V 244 H 738 V 236" style="fill:none;stroke:var(--cta,#c8643a)" stroke-width="1.3"/>
  <text x="484" y="262" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--cta,#c8643a)">프론트엔드가 하는 일</text>

  <!-- 되돌아가는 길 1: 질문 -->
  <path d="M 356 270 V 296 H 116 V 272" style="fill:none;stroke:var(--accent,#9a4a2c)" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="128" y="314" font-size="12" style="fill:var(--accent,#9a4a2c)">명세 · 디자인과 다르거나 빠진 곳은 질문</text>
  <text x="128" y="331" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">→ 확인 목록 docs/spec-design-gaps.md</text>

  <!-- 되돌아가는 길 2: 검사 -->
  <path d="M 588 270 V 338 H 420 V 272" style="fill:none;stroke:var(--accent,#9a4a2c)" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="504" y="356" text-anchor="middle" font-size="12" style="fill:var(--accent,#9a4a2c)">검사가 깨지면 고쳐서 다시</text>
</svg>
