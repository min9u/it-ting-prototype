  <text x="28" y="68" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">예열 없이: 메인 스레드가 쓴 시간 (CPU 프로필 한 번)</text>
  <text x="440" y="68" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">고친 방법 (11-13)</text>
