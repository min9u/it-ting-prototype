<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 536" width="760" height="536" role="img" aria-label="예열: 첫 진입 때 메인 스레드에 몰리던 셰이더 컴파일·Draco 해독·base64 풀기·텍스처 올리기를 로딩 중에 잘게 나누거나 다른 곳으로 옮겨 가장 긴 멈춤이 0.72초에서 0.15초로 줄었고, 기다리는 방법을 물체마다 따로에서 루프 하나로 바꿔 컴파일이 0.95초에서 0.09초로 줄었다" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" style="fill:var(--ink,#3e2a1f)">
