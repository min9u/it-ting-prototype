<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="지금 프론트엔드는 두 프로젝트다. frontend/(Next.js)는 npm run build로 .next/를 만들어 Next 서버로 띄우고 팀 리포로 옮겼다. app/(Vite)는 팀 공유용 데모만 맡아 npm run build:share로 dist-share/를 만들어 아티팩트에 올린다" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" style="fill:var(--ink,#3e2a1f)">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink-soft,#5c4334)"/></marker>
  </defs>
  <rect width="760" height="400" rx="14" style="fill:var(--fig-bg,#fffaf4)"/>

  <!-- 위: frontend/ (Next.js) -->
  <text x="16" y="34" font-weight="700">frontend/ · Next.js 16.4 · 실서비스용 (팀 리포 PR #37)</text>
  <rect x="16" y="44" width="120" height="80" rx="10" style="fill:var(--strong,#6b4a3a)"/>
  <text x="76" y="78" text-anchor="middle" font-weight="700" style="fill:var(--on-strong,#fbf4ec)">frontend/src</text>
  <text x="76" y="98" text-anchor="middle" font-size="11.5" style="fill:var(--on-strong,#fbf4ec)">화면 · API · 3D</text>
  <line x1="136" y1="84" x2="150" y2="84" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="152" y="44" width="140" height="80" rx="10" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
  <text x="164" y="68" font-weight="700" font-size="12.5">npm run build</text>
  <text x="164" y="88" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">next build</text>
  <text x="164" y="106" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">(실험실은 빠짐)</text>
  <line x1="292" y1="84" x2="318" y2="84" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="305" y="76" text-anchor="middle" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">만듦</text>
  <rect x="320" y="44" width="176" height="80" rx="10" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
  <text x="332" y="68" font-weight="700">.next/</text>
  <text x="332" y="88" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">JS · CSS · glb 파일</text>
  <text x="332" y="106" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">public/draco/ wasm 해독기</text>
  <line x1="496" y1="84" x2="522" y2="84" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="509" y="76" text-anchor="middle" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">띄움</text>
  <rect x="524" y="44" width="124" height="80" rx="10" style="fill:var(--chip-sky-bg,#d9e6ec)"/>
  <text x="586" y="70" text-anchor="middle" font-weight="700" style="fill:var(--chip-sky-fg,#2f5868)">Next 서버</text>
  <text x="586" y="90" text-anchor="middle" font-size="11.5" style="fill:var(--chip-sky-fg,#2f5868)">next start</text>
  <text x="586" y="108" text-anchor="middle" font-size="11.5" style="fill:var(--chip-sky-fg,#2f5868)">+ Nginx (미정)</text>
  <line x1="648" y1="84" x2="662" y2="84" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="664" y="44" width="80" height="80" rx="10" style="fill:var(--chip-clay-bg,#f1dccb)"/>
  <text x="704" y="78" text-anchor="middle" font-weight="700" style="fill:var(--chip-clay-fg,#7e3b22)">/burrow</text>
  <text x="704" y="98" text-anchor="middle" font-size="11.5" style="fill:var(--chip-clay-fg,#7e3b22)">브라우저</text>

  <!-- 가운데: 다른 점 -->
  <rect x="16" y="144" width="728" height="102" rx="10" style="fill:var(--accent-soft,#f6dccb)"/>
  <text x="30" y="166" font-weight="700" style="fill:var(--accent,#9a4a2c)">두 프로젝트에서 달라지는 것 (화면 코드는 거의 같음)</text>
  <g font-size="12">
    <rect x="26" y="176" width="352" height="28" rx="6" style="fill:var(--fig-bg,#fffaf4)"/>
    <text x="38" y="195">주소: /burrow (frontend) ↔ #/burrow (app 공유본)</text>
    <rect x="384" y="176" width="350" height="28" rx="6" style="fill:var(--fig-bg,#fffaf4)"/>
    <text x="396" y="195">glb: 파일 ↔ JS 안 data URL</text>
    <rect x="26" y="210" width="352" height="28" rx="6" style="fill:var(--fig-bg,#fffaf4)"/>
    <text x="38" y="229">Draco: wasm ↔ JS 해독기 (Worker)</text>
    <rect x="384" y="210" width="350" height="28" rx="6" style="fill:var(--fig-bg,#fffaf4)"/>
    <text x="396" y="229">데이터: 영역마다 목/실제 ↔ 늘 목 서버</text>
  </g>

  <!-- 아래: app/ (Vite 공유 빌드) -->
  <text x="16" y="278" font-weight="700">app/ · Vite · 팀 공유 데모만 (아티팩트)</text>
  <rect x="16" y="288" width="120" height="80" rx="10" style="fill:var(--strong,#6b4a3a)"/>
  <text x="76" y="322" text-anchor="middle" font-weight="700" style="fill:var(--on-strong,#fbf4ec)">app/src</text>
  <text x="76" y="342" text-anchor="middle" font-size="11.5" style="fill:var(--on-strong,#fbf4ec)">예전 앱</text>
  <line x1="136" y1="328" x2="150" y2="328" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="152" y="288" width="140" height="80" rx="10" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
  <text x="162" y="312" font-weight="700" font-size="11.5">npm run build:share</text>
  <text x="164" y="332" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">vite build</text>
  <text x="164" y="350" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">--mode share</text>
  <line x1="292" y1="328" x2="318" y2="328" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="305" y="320" text-anchor="middle" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">만듦</text>
  <rect x="320" y="288" width="176" height="80" rx="10" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
  <text x="332" y="312" font-weight="700">dist-share/</text>
  <text x="332" y="332" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">share-page.html</text>
  <text x="332" y="350" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">+ 올릴 목록 files.json</text>
  <line x1="496" y1="328" x2="522" y2="328" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="509" y="320" text-anchor="middle" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">올림</text>
  <rect x="524" y="288" width="124" height="80" rx="10" style="fill:var(--chip-sky-bg,#d9e6ec)"/>
  <text x="586" y="322" text-anchor="middle" font-weight="700" style="fill:var(--chip-sky-fg,#2f5868)">Claude</text>
  <text x="586" y="342" text-anchor="middle" font-size="11.5" style="fill:var(--chip-sky-fg,#2f5868)">아티팩트</text>
  <line x1="648" y1="328" x2="662" y2="328" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="664" y="288" width="80" height="80" rx="10" style="fill:var(--chip-clay-bg,#f1dccb)"/>
  <text x="704" y="322" text-anchor="middle" font-weight="700" style="fill:var(--chip-clay-fg,#7e3b22)">#/burrow</text>
  <text x="704" y="342" text-anchor="middle" font-size="11.5" style="fill:var(--chip-clay-fg,#7e3b22)">브라우저</text>

  <text x="16" y="390" font-size="11.5" style="fill:var(--ink-mute,#8a7262)">app/ 는 API v1 맞추기까지는 같이 고쳤고(2026-11-23 명세 35d107a), 그 뒤 명세 반영은 frontend/ 에만</text>
</svg>
