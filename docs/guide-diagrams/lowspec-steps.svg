<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 516" width="760" height="516" role="img" aria-label="그래픽 가속이 꺼진 PC 대응 7단계(11-11~11-17): 알아차리기에서 덜 그리기, 실제 PC 측정, 선명하게 다듬기로 이어진 흐름과 단계마다 대표 숫자" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" style="fill:var(--ink,#3e2a1f)">
  <rect width="760" height="516" rx="14" style="fill:var(--fig-bg,#fffaf4)"/>

  <!-- 세로 줄 -->
  <line x1="104" y1="45" x2="104" y2="405" style="stroke:var(--box-line,#e3cbb5)" stroke-width="3"/>

  <!-- 1 -->
  <text x="48" y="39" text-anchor="middle" font-size="12" style="fill:var(--ink-soft,#5c4334)">11-11</text>
  <rect x="12" y="46" width="72" height="18" rx="9" style="fill:var(--chip-butter-bg,#f3e6be)"/>
  <text x="48" y="59" text-anchor="middle" font-size="11" style="fill:var(--chip-butter-fg,#6b5410)">알아차리기</text>
  <circle cx="104" cy="45" r="12" style="fill:var(--cta,#c8643a)"/>
  <text x="104" y="50" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--on-strong,#fbf4ec)">1</text>
  <rect x="124" y="20" width="620" height="50" rx="10" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
  <text x="138" y="41" font-weight="700">1차 감지 · 안내 띠</text>
  <text x="138" y="59" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">WebGL을 달라며 “느리면 주지 마” + 렌더러 이름 확인</text>
  <rect x="528" y="26" width="206" height="38" rx="8" style="fill:var(--accent-soft,#f6dccb)"/>
  <text x="631" y="42" text-anchor="middle" font-weight="700" style="fill:var(--accent,#9a4a2c)">몇 ms 안에 감지</text>
  <text x="631" y="58" text-anchor="middle" font-size="11" style="fill:var(--ink-soft,#5c4334)">서로 다른 신호 4개가 일치</text>

  <!-- 2 -->
  <text x="48" y="99" text-anchor="middle" font-size="12" style="fill:var(--ink-soft,#5c4334)">11-11</text>
  <rect x="12" y="106" width="72" height="18" rx="9" style="fill:var(--chip-clay-bg,#f1dccb)"/>
  <text x="48" y="119" text-anchor="middle" font-size="11" style="fill:var(--chip-clay-fg,#7e3b22)">덜 그리기</text>
  <circle cx="104" cy="105" r="12" style="fill:var(--cta,#c8643a)"/>
  <text x="104" y="110" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--on-strong,#fbf4ec)">2</text>
  <rect x="124" y="80" width="620" height="50" rx="10" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
  <text x="138" y="101" font-weight="700">1차 저사양 모드</text>
  <text x="138" y="119" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">해상도 0.55배 · 그림자 · 후처리 끔 · 쉬면 그리기 멈춤</text>
  <rect x="528" y="86" width="206" height="38" rx="8" style="fill:var(--accent-soft,#f6dccb)"/>
  <text x="631" y="102" text-anchor="middle" font-weight="700" style="fill:var(--accent,#9a4a2c)">한 프레임 236 → 52ms</text>
  <text x="631" y="118" text-anchor="middle" font-size="11" style="fill:var(--ink-soft,#5c4334)">벤치, 윈도우 WARP</text>

  <!-- 3 -->
  <text x="48" y="159" text-anchor="middle" font-size="12" style="fill:var(--ink-soft,#5c4334)">11-11~12</text>
  <rect x="12" y="166" width="72" height="18" rx="9" style="fill:var(--chip-clay-bg,#f1dccb)"/>
  <text x="48" y="179" text-anchor="middle" font-size="11" style="fill:var(--chip-clay-fg,#7e3b22)">덜 그리기</text>
  <circle cx="104" cy="165" r="12" style="fill:var(--cta,#c8643a)"/>
  <text x="104" y="170" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--on-strong,#fbf4ec)">3</text>
  <rect x="124" y="140" width="620" height="50" rx="10" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
  <text x="138" y="161" font-weight="700">실험실 A: 배경은 한 번만</text>
  <text x="138" y="179" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">움직이지 않는 것은 한 번 그려 두고, 두더지만 매번</text>
  <rect x="528" y="146" width="206" height="38" rx="8" style="fill:var(--accent-soft,#f6dccb)"/>
  <text x="631" y="162" text-anchor="middle" font-weight="700" style="fill:var(--accent,#9a4a2c)">탐색 걷기 8.7 → 60fps</text>
  <text x="631" y="178" text-anchor="middle" font-size="11" style="fill:var(--ink-soft,#5c4334)">페이지 fps, 2코어로 묶은 WARP</text>

  <!-- 4 -->
  <text x="48" y="219" text-anchor="middle" font-size="12" style="fill:var(--ink-soft,#5c4334)">11-12</text>
  <rect x="12" y="226" width="72" height="18" rx="9" style="fill:var(--chip-sky-bg,#d9e6ec)"/>
  <text x="48" y="239" text-anchor="middle" font-size="11" style="fill:var(--chip-sky-fg,#2f5868)">선명하게</text>
  <circle cx="104" cy="225" r="12" style="fill:var(--cta,#c8643a)"/>
  <text x="104" y="230" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--on-strong,#fbf4ec)">4</text>
  <rect x="124" y="200" width="620" height="50" rx="10" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
  <text x="138" y="221" font-weight="700">S · N: 방은 선명하게</text>
  <text x="138" y="239" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">멈추면 방만 고해상도로 한 번 · 가구는 처음부터 제자리</text>
  <rect x="528" y="206" width="206" height="38" rx="8" style="fill:var(--accent-soft,#f6dccb)"/>
  <text x="631" y="222" text-anchor="middle" font-weight="700" style="fill:var(--accent,#9a4a2c)">“방이 깨져 보여요” 해결</text>
  <text x="631" y="238" text-anchor="middle" font-size="11" style="fill:var(--ink-soft,#5c4334)">사용자 요청</text>

  <!-- 5 -->
  <text x="48" y="279" text-anchor="middle" font-size="12" style="fill:var(--ink-soft,#5c4334)">11-13</text>
  <rect x="12" y="286" width="72" height="18" rx="9" style="fill:var(--chip-sage-bg,#dde7cc)"/>
  <text x="48" y="299" text-anchor="middle" font-size="11" style="fill:var(--chip-sage-fg,#3f5a24)">실제로 재기</text>
  <circle cx="104" cy="285" r="12" style="fill:var(--cta,#c8643a)"/>
  <text x="104" y="290" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--on-strong,#fbf4ec)">5</text>
  <rect x="124" y="260" width="620" height="50" rx="10" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
  <text x="138" y="281" font-weight="700">실제 SSAFY PC에서 재기</text>
  <text x="138" y="299" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">i7-11700 · RTX가 있지만 크롬 가속 꺼짐 = WARP</text>
  <rect x="528" y="266" width="206" height="38" rx="8" style="fill:var(--accent-soft,#f6dccb)"/>
  <text x="631" y="282" text-anchor="middle" font-weight="700" style="fill:var(--accent,#9a4a2c)">10fps 제한 풂 → 60fps</text>
  <text x="631" y="298" text-anchor="middle" font-size="11" style="fill:var(--ink-soft,#5c4334)">걷기 장면, 긴 작업 0</text>

  <!-- 6 -->
  <text x="48" y="339" text-anchor="middle" font-size="12" style="fill:var(--ink-soft,#5c4334)">11-16</text>
  <rect x="12" y="346" width="72" height="18" rx="9" style="fill:var(--chip-clay-bg,#f1dccb)"/>
  <text x="48" y="359" text-anchor="middle" font-size="11" style="fill:var(--chip-clay-fg,#7e3b22)">덜 그리기</text>
  <circle cx="104" cy="345" r="12" style="fill:var(--cta,#c8643a)"/>
  <text x="104" y="350" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--on-strong,#fbf4ec)">6</text>
  <rect x="124" y="320" width="620" height="50" rx="10" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
  <text x="138" y="341" font-weight="700">2차: 탐색 들판</text>
  <text x="138" y="359" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">병목은 픽셀 → 배경 한 번 · 두더지 둘레만 · 이동 중 저해상도</text>
  <rect x="528" y="326" width="206" height="38" rx="8" style="fill:var(--accent-soft,#f6dccb)"/>
  <text x="631" y="342" text-anchor="middle" font-weight="700" style="fill:var(--accent,#9a4a2c)">점프 28 → 57.7fps</text>
  <text x="631" y="358" text-anchor="middle" font-size="11" style="fill:var(--ink-soft,#5c4334)">장면 fps, 16스레드 WARP</text>

  <!-- 7 -->
  <text x="48" y="399" text-anchor="middle" font-size="12" style="fill:var(--ink-soft,#5c4334)">11-16~17</text>
  <rect x="12" y="406" width="72" height="18" rx="9" style="fill:var(--chip-sky-bg,#d9e6ec)"/>
  <text x="48" y="419" text-anchor="middle" font-size="11" style="fill:var(--chip-sky-fg,#2f5868)">선명하게</text>
  <circle cx="104" cy="405" r="12" style="fill:var(--cta,#c8643a)"/>
  <text x="104" y="410" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--on-strong,#fbf4ec)">7</text>
  <rect x="124" y="380" width="620" height="50" rx="10" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
  <text x="138" y="401" font-weight="700">3차: 기기 단계 · 굽기</text>
  <text x="138" y="419" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">PC 세기 자동 판단 · 예열 다시 · 띠로 나눠 굽기 · 그림 기억</text>
  <rect x="528" y="386" width="206" height="38" rx="8" style="fill:var(--accent-soft,#f6dccb)"/>
  <text x="631" y="402" text-anchor="middle" font-weight="700" style="fill:var(--accent,#9a4a2c)">배경 PSNR 36.9 → 51.6dB</text>
  <text x="631" y="418" text-anchor="middle" font-size="11" style="fill:var(--ink-soft,#5c4334)">내 땅굴, GPU 화면 대비</text>

  <!-- 지금 -->
  <rect x="16" y="446" width="728" height="34" rx="8" style="fill:var(--chip-mint-bg,#d5e8df)"/>
  <text x="380" y="468" text-anchor="middle" font-size="12.5" style="fill:var(--chip-mint-fg,#2e5e4c)">지금 기본값: 가속이 꺼졌을 때만 위 기법이 켜짐. GPU PC는 그림 · fps 그대로 (배경 PSNR 99dB)</text>
  <text x="380" y="502" text-anchor="middle" font-size="11.5" style="fill:var(--ink-mute,#8a7262)">숫자는 단계마다 잰 조건(PC · 코어 수 · 화면 · 지표)이 달라 서로 비교하지 않는다</text>
</svg>
