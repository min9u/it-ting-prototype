<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 444" width="760" height="444" role="img" aria-label="브라우저(프론트엔드), API 계약, 서버(백엔드), DB가 각각 맡는 일과 그 사이를 오가는 요청·응답·실시간 연결" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" style="fill:var(--ink,#3e2a1f)">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink-soft,#5c4334)"/></marker>
    <marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--cta,#c8643a)"/></marker>
  </defs>
  <rect width="760" height="444" rx="14" style="fill:var(--fig-bg,#fffaf4)"/>

  <!-- 머리 -->
  <rect x="44" y="20" width="190" height="30" rx="15" style="fill:var(--chip-clay-bg,#f1dccb)"/>
  <text x="139" y="40" text-anchor="middle" font-weight="700" style="fill:var(--chip-clay-fg,#7e3b22)">브라우저 · 프론트엔드</text>
  <rect x="292" y="20" width="140" height="30" rx="15" style="fill:var(--accent-soft,#f6dccb)"/>
  <text x="362" y="40" text-anchor="middle" font-weight="700" style="fill:var(--accent,#9a4a2c)">약속 · API 계약</text>
  <rect x="488" y="20" width="140" height="30" rx="15" style="fill:var(--chip-sky-bg,#d9e6ec)"/>
  <text x="558" y="40" text-anchor="middle" font-weight="700" style="fill:var(--chip-sky-fg,#2f5868)">서버 · 백엔드</text>
  <rect x="678" y="20" width="66" height="30" rx="15" style="fill:var(--chip-sage-bg,#dde7cc)"/>
  <text x="711" y="40" text-anchor="middle" font-weight="700" style="fill:var(--chip-sage-fg,#3f5a24)">DB</text>

  <!-- 브라우저 칸 -->
  <rect x="16" y="62" width="246" height="322" rx="12" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
  <g>
    <rect x="28" y="74" width="222" height="44" rx="8" style="fill:var(--fig-bg,#fffaf4);stroke:var(--box-line,#e3cbb5)"/>
    <text x="40" y="92" font-weight="700">화면 그리기</text>
    <text x="40" y="109" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">React 조각 · 3D 땅굴과 들판</text>
    <rect x="28" y="124" width="222" height="44" rx="8" style="fill:var(--fig-bg,#fffaf4);stroke:var(--box-line,#e3cbb5)"/>
    <text x="40" y="142" font-weight="700">상태 4개 보여 주기</text>
    <text x="40" y="159" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">불러오는 중 · 오류 · 없음 · 정상</text>
    <rect x="28" y="174" width="222" height="44" rx="8" style="fill:var(--fig-bg,#fffaf4);stroke:var(--box-line,#e3cbb5)"/>
    <text x="40" y="192" font-weight="700">입력 먼저 검사</text>
    <text x="40" y="209" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">글자 수 · 빈 칸 (사용자 편의)</text>
    <rect x="28" y="224" width="222" height="44" rx="8" style="fill:var(--fig-bg,#fffaf4);stroke:var(--box-line,#e3cbb5)"/>
    <text x="40" y="242" font-weight="700">받은 데이터 기억 (캐시)</text>
    <text x="40" y="259" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">다시 오면 기억한 값부터 보여 줌</text>
    <rect x="28" y="274" width="222" height="44" rx="8" style="fill:var(--fig-bg,#fffaf4);stroke:var(--box-line,#e3cbb5)"/>
    <text x="40" y="292" font-weight="700">먼저 바꿔 보여 주기</text>
    <text x="40" y="309" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">찜 → 화면 먼저, 실패면 되돌림</text>
    <rect x="28" y="324" width="222" height="44" rx="8" style="fill:var(--fig-bg,#fffaf4);stroke:var(--box-line,#e3cbb5)"/>
    <text x="40" y="342" font-weight="700">보여 줄 글자 만들기</text>
    <text x="40" y="359" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">ISO 날짜 → “3분 전” (서울 시간)</text>
  </g>

  <!-- 약속 칸: 화살표가 지나가는 자리 + 정할 것 -->
  <rect x="274" y="62" width="176" height="322" rx="12" style="fill:none;stroke:var(--accent,#9a4a2c)" stroke-dasharray="5 4"/>
  <text x="362" y="104" text-anchor="middle" font-size="12" style="fill:var(--ink-soft,#5c4334)">요청 (HTTP, /api/…)</text>
  <line x1="264" y1="114" x2="458" y2="114" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="458" y1="138" x2="264" y2="138" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="362" y="156" text-anchor="middle" font-size="12" style="fill:var(--ink-soft,#5c4334)">응답 (JSON) 또는 에러</text>
  <text x="362" y="190" text-anchor="middle" font-size="12" style="fill:var(--cta,#c8643a)">실시간 (WebSocket, /ws)</text>
  <line x1="266" y1="200" x2="456" y2="200" style="stroke:var(--cta,#c8643a)" stroke-width="2" marker-start="url(#ahc)" marker-end="url(#ahc)"/>
  <text x="362" y="217" text-anchor="middle" font-size="11.5" style="fill:var(--ink-mute,#8a7262)">채팅: 계속 열린 연결</text>

  <rect x="282" y="230" width="160" height="146" rx="8" style="fill:var(--accent-soft,#f6dccb)"/>
  <text x="294" y="250" font-weight="700" style="fill:var(--accent,#9a4a2c)">계약서에 정할 것</text>
  <g font-size="12">
    <text x="294" y="270">· 주소와 방법</text>
    <text x="294" y="288">· 데이터 모양 (DTO)</text>
    <text x="294" y="306">· 에러 {code, message}</text>
    <text x="294" y="324">· ID는 문자열 "42"</text>
    <text x="294" y="342">· 날짜는 ISO + 오프셋</text>
    <text x="294" y="360">· 목록은 번호 / 커서</text>
  </g>

  <!-- 서버 칸 -->
  <rect x="462" y="62" width="192" height="322" rx="12" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
  <g>
    <rect x="474" y="74" width="168" height="54" rx="8" style="fill:var(--fig-bg,#fffaf4);stroke:var(--box-line,#e3cbb5)"/>
    <text x="486" y="96" font-weight="700">로그인 · 권한 확인</text>
    <text x="486" y="115" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">아니면 401 · 403</text>
    <rect x="474" y="136" width="168" height="54" rx="8" style="fill:var(--fig-bg,#fffaf4);stroke:var(--box-line,#e3cbb5)"/>
    <text x="486" y="158" font-weight="700">규칙 최종 판정</text>
    <text x="486" y="177" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">정원 · 마감 · 글자 수</text>
    <rect x="474" y="198" width="168" height="54" rx="8" style="fill:var(--fig-bg,#fffaf4);stroke:var(--box-line,#e3cbb5)"/>
    <text x="486" y="220" font-weight="700">값 계산해서 주기</text>
    <text x="486" y="239" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">모집 상태 · 안 읽은 수 · 만료</text>
    <rect x="474" y="260" width="168" height="54" rx="8" style="fill:var(--fig-bg,#fffaf4);stroke:var(--box-line,#e3cbb5)"/>
    <text x="486" y="282" font-weight="700">채팅 순서 지키기</text>
    <text x="486" y="301" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">방별 seq · 중복 막는 id</text>
    <rect x="474" y="322" width="168" height="50" rx="8" style="fill:var(--fig-bg,#fffaf4);stroke:var(--box-line,#e3cbb5)"/>
    <text x="486" y="343" font-weight="700">저장 · 꺼내기</text>
    <text x="486" y="361" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">DB 읽기 · 쓰기</text>
  </g>

  <!-- DB -->
  <line x1="656" y1="222" x2="676" y2="222" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <rect x="678" y="62" width="66" height="322" rx="12" style="fill:var(--chip-sage-bg,#dde7cc)"/>
  <g text-anchor="middle" style="fill:var(--chip-sage-fg,#3f5a24)">
    <text x="711" y="204" font-weight="700">테이블</text>
    <text x="711" y="224" font-weight="700">38개</text>
    <text x="711" y="246" font-size="11">ERD 초안</text>
  </g>

  <!-- 지금 상태 -->
  <rect x="16" y="398" width="728" height="32" rx="8" style="fill:none;stroke:var(--ink-mute,#8a7262)" stroke-dasharray="4 4"/>
  <text x="380" y="419" text-anchor="middle" font-size="12.5" style="fill:var(--ink-soft,#5c4334)">지금은 서버 · DB 자리에 목 서버(가짜 서버)가 있다. 같은 모양 · 같은 실패를 흉내 냄 (VITE_API_MODE=mock)</text>
</svg>
