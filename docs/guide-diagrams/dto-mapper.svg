<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 412" width="760" height="412" role="img" aria-label="서버가 주는 댓글 모양(CommentDto)을 api/mappers.ts가 앱 모양(BoardComment)으로 번역한다. ID는 문자열로, ISO 날짜는 ms 숫자로, 탈퇴한 사람은 'gone'으로. 서버 모양이 바뀌면 매퍼만 고치고 화면은 그대로 둔다" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" style="fill:var(--ink,#3e2a1f)">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink-soft,#5c4334)"/></marker>
  </defs>
  <rect width="760" height="412" rx="14" style="fill:var(--fig-bg,#fffaf4)"/>

  <!-- 머리 -->
  <rect x="16" y="16" width="224" height="26" rx="13" style="fill:var(--chip-sky-bg,#d9e6ec)"/>
  <text x="128" y="34" text-anchor="middle" font-weight="700" style="fill:var(--chip-sky-fg,#2f5868)">서버가 주는 모양 (DTO)</text>
  <rect x="276" y="16" width="208" height="26" rx="13" style="fill:var(--accent-soft,#f6dccb)"/>
  <text x="380" y="34" text-anchor="middle" font-weight="700" style="fill:var(--accent,#9a4a2c)">번역 (매퍼)</text>
  <rect x="520" y="16" width="224" height="26" rx="13" style="fill:var(--chip-clay-bg,#f1dccb)"/>
  <text x="632" y="34" text-anchor="middle" font-weight="700" style="fill:var(--chip-clay-fg,#7e3b22)">앱이 쓰는 모양</text>
  <g font-size="11.5" font-family="'Nanum Gothic Coding','D2Coding',Consolas,monospace" text-anchor="middle" style="fill:var(--ink-mute,#8a7262)">
    <text x="128" y="60">api/types.ts CommentDto</text>
    <text x="380" y="60">api/mappers.ts toBoardComment</text>
    <text x="632" y="60">data/boardStore.ts BoardComment</text>
  </g>

  <!-- 줄 1: ID -->
  <rect x="16" y="72" width="224" height="52" rx="8" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
  <text x="30" y="94" font-family="'Nanum Gothic Coding','D2Coding',Consolas,monospace" font-size="12.5">"id": 42</text>
  <text x="30" y="113" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">DB의 BIGINT가 숫자로 와도</text>
  <line x1="242" y1="98" x2="274" y2="98" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="276" y="72" width="208" height="52" rx="8" style="fill:var(--accent-soft,#f6dccb)"/>
  <text x="380" y="94" text-anchor="middle" font-weight="700" style="fill:var(--accent,#9a4a2c)">toId → String(v)</text>
  <text x="380" y="113" text-anchor="middle" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">비교는 늘 문자열끼리</text>
  <line x1="486" y1="98" x2="518" y2="98" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="520" y="72" width="224" height="52" rx="8" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
  <text x="534" y="94" font-family="'Nanum Gothic Coding','D2Coding',Consolas,monospace" font-size="12.5">id: '42'</text>
  <text x="534" y="113" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">늘 문자열</text>

  <!-- 줄 2: 날짜 -->
  <rect x="16" y="132" width="224" height="52" rx="8" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
  <text x="30" y="153" font-family="'Nanum Gothic Coding','D2Coding',Consolas,monospace" font-size="12.5">"createdAt":</text>
  <text x="30" y="172" font-family="'Nanum Gothic Coding','D2Coding',Consolas,monospace" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">"2026-11-16T17:40:05+09:00"</text>
  <line x1="242" y1="158" x2="274" y2="158" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="276" y="132" width="208" height="52" rx="8" style="fill:var(--accent-soft,#f6dccb)"/>
  <text x="380" y="154" text-anchor="middle" font-weight="700" style="fill:var(--accent,#9a4a2c)">parseIso (lib/time.ts)</text>
  <text x="380" y="173" text-anchor="middle" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">오프셋 붙은 ISO → ms 숫자</text>
  <line x1="486" y1="158" x2="518" y2="158" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="520" y="132" width="224" height="52" rx="8" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
  <text x="534" y="154" font-family="'Nanum Gothic Coding','D2Coding',Consolas,monospace" font-size="12.5">at: 1794818405000</text>
  <text x="534" y="173" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">ms 숫자 (빼고 비교하기 쉬움)</text>

  <!-- 줄 3: 탈퇴한 사람 -->
  <rect x="16" y="192" width="224" height="52" rx="8" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
  <text x="30" y="213" font-family="'Nanum Gothic Coding','D2Coding',Consolas,monospace" font-size="12.5">"author": {</text>
  <text x="30" y="232" font-family="'Nanum Gothic Coding','D2Coding',Consolas,monospace" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">  "status": "WITHDRAWN", … }</text>
  <line x1="242" y1="218" x2="274" y2="218" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="276" y="192" width="208" height="52" rx="8" style="fill:var(--accent-soft,#f6dccb)"/>
  <text x="380" y="214" text-anchor="middle" font-weight="700" style="fill:var(--accent,#9a4a2c)">toPerson → 'gone'</text>
  <text x="380" y="233" text-anchor="middle" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">화면엔 “탈퇴한 사용자”</text>
  <line x1="486" y1="218" x2="518" y2="218" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="520" y="192" width="224" height="52" rx="8" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
  <text x="534" y="214" font-family="'Nanum Gothic Coding','D2Coding',Consolas,monospace" font-size="12.5">authorId: 'gone'</text>
  <text x="534" y="233" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">사람 객체 대신 id 하나</text>

  <!-- 줄 4: 이름 바꾸기 -->
  <rect x="16" y="252" width="224" height="52" rx="8" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
  <text x="30" y="273" font-family="'Nanum Gothic Coding','D2Coding',Consolas,monospace" font-size="12.5">"content": "…"</text>
  <text x="30" y="292" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">ERD 칼럼 이름 그대로</text>
  <line x1="242" y1="278" x2="274" y2="278" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="276" y="252" width="208" height="52" rx="8" style="fill:var(--accent-soft,#f6dccb)"/>
  <text x="380" y="274" text-anchor="middle" font-weight="700" style="fill:var(--accent,#9a4a2c)">이름만 바꿈</text>
  <text x="380" y="293" text-anchor="middle" font-size="11.5" font-family="'Nanum Gothic Coding','D2Coding',Consolas,monospace" style="fill:var(--ink-soft,#5c4334)">content → text</text>
  <line x1="486" y1="278" x2="518" y2="278" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="520" y="252" width="224" height="52" rx="8" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
  <text x="534" y="273" font-family="'Nanum Gothic Coding','D2Coding',Consolas,monospace" font-size="12.5">text: '…'</text>
  <text x="534" y="292" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">화면 코드가 쓰는 이름</text>

  <!-- 바뀌면 -->
  <line x1="632" y1="306" x2="632" y2="338" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="642" y="326" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">화면이 받는 것</text>
  <rect x="16" y="340" width="468" height="54" rx="10" style="fill:var(--accent-soft,#f6dccb);stroke:var(--cta,#c8643a)"/>
  <text x="30" y="362" font-weight="700" style="fill:var(--accent,#9a4a2c)">서버가 칸 이름 · 모양을 바꾸면?</text>
  <text x="30" y="382" font-size="12" style="fill:var(--ink-soft,#5c4334)">types.ts(DTO)와 mappers.ts 만 고친다</text>
  <rect x="520" y="340" width="224" height="54" rx="10" style="fill:var(--chip-mint-bg,#d5e8df)"/>
  <text x="534" y="362" font-weight="700" style="fill:var(--chip-mint-fg,#2e5e4c)">화면은 그대로</text>
  <text x="534" y="382" font-size="11.5" font-family="'Nanum Gothic Coding','D2Coding',Consolas,monospace" style="fill:var(--chip-mint-fg,#2e5e4c)">screens/board/BoardPost.tsx</text>
</svg>
