  <text x="96" y="200" text-anchor="middle" font-size="12" style="fill:var(--ink-soft,#5c4334)">픽셀로 뽑은 색</text>
  <text x="96" y="230" text-anchor="middle" font-size="11" font-family="'Nanum Gothic Coding','D2Coding',Consolas,monospace" style="fill:var(--ink-mute,#8a7262)">design/figma/</text>
