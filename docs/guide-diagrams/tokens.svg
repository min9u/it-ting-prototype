    <text x="526" y="117" font-size="11" font-family="'Nanum Gothic Coding','D2Coding',Consolas,monospace" style="fill:var(--ink-soft,#5c4334)">AppHeader.module.css .active</text>
    <rect x="508" y="132" width="226" height="44" rx="8" style="fill:var(--fig-bg,#fffaf4);stroke:var(--box-line,#e3cbb5)"/>
