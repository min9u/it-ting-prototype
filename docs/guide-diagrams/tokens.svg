  <rect x="222" y="52" width="230" height="214" rx="12" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
  <g font-family="'Nanum Gothic Coding','D2Coding',Consolas,monospace">
