    <text x="526" y="150" font-weight="700">쪽 번호의 지금 칸</text>
    <text x="526" y="167" font-size="11" font-family="'Nanum Gothic Coding','D2Coding',Consolas,monospace" style="fill:var(--ink-soft,#5c4334)">Pagination.module.css .on</text>
    <rect x="508" y="182" width="226" height="44" rx="8" style="fill:var(--fig-bg,#fffaf4);stroke:var(--box-line,#e3cbb5)"/>
    <rect x="508" y="182" width="8" height="44" rx="3" fill="#6b4a3a"/>
    <text x="526" y="200" font-weight="700">게시판 탭 (고른 것)</text>
    <text x="526" y="217" font-size="11" font-family="'Nanum Gothic Coding','D2Coding',Consolas,monospace" style="fill:var(--ink-soft,#5c4334)">Board.module.css .tabOn</text>
  </g>
  <text x="621" y="250" text-anchor="middle" font-size="12" style="fill:var(--ink-soft,#5c4334)">… 이 토큰을 쓰는 CSS 파일 17개</text>

  <!-- 한 줄 고치면 -->
