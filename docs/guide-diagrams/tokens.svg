<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-label="Figma 시안에서 뽑은 색에 tokens.css가 이름을 붙이고, 컴포넌트 CSS는 그 이름만 가져다 써서 한 줄을 고치면 17개 CSS 파일이 같이 바뀐다. CSS Modules는 같은 .title도 파일마다 다른 이름으로 바꾼다" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" style="fill:var(--ink,#3e2a1f)">
