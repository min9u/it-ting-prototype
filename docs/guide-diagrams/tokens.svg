  <text x="380" y="302" text-anchor="middle" style="fill:var(--accent,#9a4a2c)"><tspan font-weight="700">tokens.css의 --brown-700 한 줄</tspan>만 고치면 → 그 토큰을 쓰는 CSS 파일 17개의 색이 한꺼번에 바뀜</text>

  <!-- CSS Modules -->
