  <text x="16" y="364" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">빌드할 때 이름 뒤에 파일마다 다른 꼬리표를 붙여, 같은 .title 이 서로 덮어쓰지 않음</text>

