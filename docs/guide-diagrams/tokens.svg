  <text x="621" y="34" text-anchor="middle" font-weight="700" style="fill:var(--chip-clay-fg,#7e3b22)">컴포넌트 CSS (*.module.css)</text>

  <!-- Figma: 실제 토큰 색으로 그린 작은 화면 -->
  <rect x="16" y="52" width="160" height="214" rx="12" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
  <rect x="30" y="64" width="132" height="90" rx="6" fill="#fbf4ec" style="stroke:var(--box-line,#e3cbb5)"/>
