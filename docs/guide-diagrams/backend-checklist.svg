    <text x="40" y="100" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">같은 출처 + /api/v1/…</text>

    <rect x="256" y="54" width="216" height="58" rx="8" style="fill:var(--fig-bg,#fffaf4);stroke:var(--box-line,#e3cbb5)"/>
    <rect x="268" y="66" width="13" height="13" rx="2" style="fill:var(--chip-mint-bg,#d5e8df);stroke:var(--chip-mint-fg,#2e5e4c)" stroke-width="1.5"/>
    <path d="M270.5 72.5 L273.5 76 L279 68.5" style="fill:none;stroke:var(--chip-mint-fg,#2e5e4c)" stroke-width="1.8"/>
