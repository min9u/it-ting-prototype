<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 486" width="760" height="486" role="img" aria-label="백엔드 확정 API 명세 v1(API 111개)로 정해진 약속 8개와, 프론트가 아직 백엔드에 묻고 있는 질문. 프론트는 이 약속에 맞췄고, 남은 질문은 지금 정한 방식대로 동작한다" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" style="fill:var(--ink,#3e2a1f)">
