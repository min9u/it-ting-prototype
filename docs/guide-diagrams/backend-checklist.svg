    <text x="268" y="298" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">SSE 하나 · 보내기는 일반 API</text>
  </g>

  <!-- 맞춘 뒤 -->
  <rect x="16" y="338" width="468" height="74" rx="12" style="fill:var(--chip-mint-bg,#d5e8df)"/>
  <g style="fill:var(--chip-mint-fg,#2e5e4c)">
    <text x="28" y="362" font-weight="700">프론트가 맞춘 곳 (2026-11-23 API 111개 모두)</text>
    <text x="28" y="382" font-size="11.5">영역 폴더 11개 frontend/src/api/&lt;영역&gt;/ (화면은 그대로)</text>
    <text x="28" y="400" font-size="11.5">명세 모양 types.ts · 앱 모양으로 번역 mappers.ts · code → 문구 errors.ts</text>
  </g>
  <text x="28" y="443" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">우리 초안(api-draft.md, 2026-11-16)과 달라진 것: 응답 틀, 숫자 ID, UTC,</text>
  <text x="28" y="461" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">갱신 API 없음, WebSocket + STOMP → SSE (6-2 표)</text>

