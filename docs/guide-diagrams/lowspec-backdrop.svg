<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-label="GPU PC는 매 프레임 장면 전체를 그리지만, 가속이 꺼진 PC는 배경을 한 번만 그려 두고 매 프레임 두더지만 그린다. 선명한 배경은 2D 캔버스 · WebGL 캔버스 · HTML 세 층으로 겹친다" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" style="fill:var(--ink,#3e2a1f)">
  <rect width="760" height="500" rx="14" style="fill:var(--fig-bg,#fffaf4)"/>

  <!-- 머리 -->
  <rect x="16" y="16" width="348" height="30" rx="15" style="fill:var(--chip-sage-bg,#dde7cc)"/>
  <text x="190" y="36" text-anchor="middle" font-weight="700" style="fill:var(--chip-sage-fg,#3f5a24)">GPU PC (가속 켬)</text>
  <rect x="396" y="16" width="348" height="30" rx="15" style="fill:var(--chip-butter-bg,#f3e6be)"/>
  <text x="570" y="36" text-anchor="middle" font-weight="700" style="fill:var(--chip-butter-fg,#6b5410)">가속이 꺼진 PC (CPU가 그림)</text>

  <!-- 왼쪽: 매 프레임 전체 -->
  <g font-size="11.5" text-anchor="middle" style="fill:var(--ink-mute,#8a7262)">
    <text x="78" y="68">프레임 1</text>
    <text x="190" y="68">프레임 2</text>
    <text x="302" y="68">프레임 3</text>
  </g>
  <g>
    <rect x="28" y="76" width="100" height="84" rx="8" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
    <rect x="36" y="84" width="84" height="38" rx="5" style="fill:var(--chip-sand-bg,#eadfc6);stroke:var(--cta,#c8643a)" stroke-width="2"/>
    <text x="78" y="107" text-anchor="middle" font-size="11.5" style="fill:var(--chip-sand-fg,#5e4a1e)">방 · 가구</text>
    <circle cx="56" cy="141" r="9" style="fill:var(--strong,#6b4a3a);stroke:var(--cta,#c8643a)" stroke-width="2"/>
    <text x="70" y="145" font-size="11.5">두더지</text>

    <rect x="140" y="76" width="100" height="84" rx="8" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
    <rect x="148" y="84" width="84" height="38" rx="5" style="fill:var(--chip-sand-bg,#eadfc6);stroke:var(--cta,#c8643a)" stroke-width="2"/>
    <text x="190" y="107" text-anchor="middle" font-size="11.5" style="fill:var(--chip-sand-fg,#5e4a1e)">방 · 가구</text>
    <circle cx="176" cy="141" r="9" style="fill:var(--strong,#6b4a3a);stroke:var(--cta,#c8643a)" stroke-width="2"/>
    <text x="190" y="145" font-size="11.5">두더지</text>

    <rect x="252" y="76" width="100" height="84" rx="8" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
    <rect x="260" y="84" width="84" height="38" rx="5" style="fill:var(--chip-sand-bg,#eadfc6);stroke:var(--cta,#c8643a)" stroke-width="2"/>
    <text x="302" y="107" text-anchor="middle" font-size="11.5" style="fill:var(--chip-sand-fg,#5e4a1e)">방 · 가구</text>
    <circle cx="296" cy="141" r="9" style="fill:var(--strong,#6b4a3a);stroke:var(--cta,#c8643a)" stroke-width="2"/>
    <text x="310" y="145" font-size="11.5">두더지</text>
  </g>
  <text x="190" y="186" text-anchor="middle">매 프레임 장면 전체를 다시 그림</text>
  <text x="190" y="204" text-anchor="middle" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">그래픽카드가 그려서 충분히 빠름</text>

  <!-- 오른쪽: 배경 한 번 + 두더지만 -->
  <g font-size="11.5" text-anchor="middle" style="fill:var(--ink-mute,#8a7262)">
    <text x="458" y="68">처음 한 번</text>
    <text x="638" y="68">그 뒤 매 프레임</text>
  </g>
  <rect x="408" y="76" width="100" height="84" rx="8" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
  <rect x="416" y="84" width="84" height="38" rx="5" style="fill:var(--chip-sand-bg,#eadfc6);stroke:var(--cta,#c8643a)" stroke-width="2"/>
  <text x="458" y="107" text-anchor="middle" font-size="11.5" style="fill:var(--chip-sand-fg,#5e4a1e)">방 · 가구</text>
  <text x="458" y="146" text-anchor="middle" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">숨은 도화지에</text>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink-soft,#5c4334)"/></marker>
  </defs>
  <line x1="510" y1="118" x2="529" y2="118" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-end="url(#ah)"/>
  <g>
    <rect x="532" y="76" width="100" height="84" rx="8" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
    <rect x="540" y="84" width="84" height="38" rx="5" style="fill:var(--chip-sand-bg,#eadfc6);stroke:var(--ink-mute,#8a7262)" stroke-dasharray="3 3"/>
    <text x="582" y="107" text-anchor="middle" font-size="11.5" style="fill:var(--chip-sand-fg,#5e4a1e)">붙이기</text>
    <circle cx="560" cy="141" r="9" style="fill:var(--strong,#6b4a3a);stroke:var(--cta,#c8643a)" stroke-width="2"/>
    <text x="574" y="145" font-size="11.5">두더지</text>

    <rect x="644" y="76" width="100" height="84" rx="8" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
    <rect x="652" y="84" width="84" height="38" rx="5" style="fill:var(--chip-sand-bg,#eadfc6);stroke:var(--ink-mute,#8a7262)" stroke-dasharray="3 3"/>
    <text x="694" y="107" text-anchor="middle" font-size="11.5" style="fill:var(--chip-sand-fg,#5e4a1e)">붙이기</text>
    <circle cx="680" cy="141" r="9" style="fill:var(--strong,#6b4a3a);stroke:var(--cta,#c8643a)" stroke-width="2"/>
    <text x="694" y="145" font-size="11.5">두더지</text>
  </g>
  <text x="570" y="186" text-anchor="middle">배경은 한 번, 매 프레임은 붙이기 + 두더지만</text>
  <text x="570" y="204" text-anchor="middle" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">2코어 WARP: 탐색 걷기 페이지 8.7 → 60fps</text>
  <text x="570" y="220" text-anchor="middle" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">땅굴 들어올 때 15 → 52fps (gpu-lowspec-ideas.md)</text>

  <!-- 범례 -->
  <rect x="214" y="234" width="14" height="12" rx="2" style="fill:none;stroke:var(--cta,#c8643a)" stroke-width="2"/>
  <text x="234" y="245" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">이번에 새로 그림</text>
  <rect x="372" y="234" width="14" height="12" rx="2" style="fill:none;stroke:var(--ink-mute,#8a7262)" stroke-dasharray="3 3"/>
  <text x="392" y="245" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">저장해 둔 그림을 붙임 (렌더 타깃)</text>

  <line x1="16" y1="260" x2="744" y2="260" style="stroke:var(--box-line,#e3cbb5)"/>

  <!-- 아래: 선명한 배경의 층 -->
  <text x="16" y="284" font-weight="700">선명한 배경 (S): 화면은 층 세 장</text>
  <text x="744" y="284" text-anchor="end" font-size="11.5" style="fill:var(--ink-mute,#8a7262)">내 땅굴 · 탐색 들판 (three/sharpBake.ts)</text>

  <!-- 맨 위 HTML -->
  <path d="M70,300 L300,300 L260,344 L30,344 Z" style="fill:var(--fig-bg,#fffaf4);stroke:var(--ink-mute,#8a7262)" stroke-dasharray="4 3"/>
  <rect x="90" y="313" width="56" height="18" rx="9" style="fill:var(--chip-clay-bg,#f1dccb)"/>
  <text x="118" y="326" text-anchor="middle" font-size="11.5" style="fill:var(--chip-clay-fg,#7e3b22)">이름표</text>
  <rect x="190" y="310" width="56" height="24" rx="4" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
  <text x="218" y="326" text-anchor="middle" font-size="11.5">패널</text>
  <line x1="284" y1="322" x2="326" y2="322" style="stroke:var(--ink-mute,#8a7262)" stroke-dasharray="2 3"/>
  <text x="334" y="316" font-weight="700">맨 위: HTML</text>
  <text x="334" y="334" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">이름표 · 말풍선 · 패널 · 버튼. 글자는 늘 선명</text>

  <!-- 가운데 WebGL -->
  <path d="M70,358 L300,358 L260,402 L30,402 Z" style="fill:none;stroke:var(--ink-mute,#8a7262)" stroke-dasharray="4 3"/>
  <circle cx="150" cy="380" r="11" style="fill:var(--strong,#6b4a3a)"/>
  <text x="168" y="384" font-size="11.5">두더지</text>
  <line x1="284" y1="380" x2="326" y2="380" style="stroke:var(--ink-mute,#8a7262)" stroke-dasharray="2 3"/>
  <text x="334" y="374" font-weight="700">가운데: WebGL 캔버스 (해상도 0.55배)</text>
  <text x="334" y="392" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">투명하게 지우고 두더지만 매 프레임. 방의 깊이만 빌려 가림을 맞춤</text>

  <!-- 맨 아래 2D -->
  <path d="M70,416 L300,416 L260,460 L30,460 Z" style="fill:var(--chip-sand-bg,#eadfc6);stroke:var(--box-line,#e3cbb5)"/>
  <text x="165" y="443" text-anchor="middle" font-size="12" style="fill:var(--chip-sand-fg,#5e4a1e)">방 · 가구 (선명)</text>
  <line x1="284" y1="438" x2="326" y2="438" style="stroke:var(--ink-mute,#8a7262)" stroke-dasharray="2 3"/>
  <text x="334" y="432" font-weight="700">맨 아래: 2D 캔버스 (화면 해상도)</text>
  <text x="334" y="450" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">방이 멈췄을 때 한 번 구움: MSAA · 띠로 나눠 · 비동기로 읽기</text>

  <text x="380" y="486" text-anchor="middle" font-size="12" style="fill:var(--ink-soft,#5c4334)">카메라 · 패널이 움직이는 동안은 전부 0.55배로 그리고, 0.35초 조용하면 다시 구움 (roomScene.ts)</text>
</svg>
