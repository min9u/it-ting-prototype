<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" width="760" height="396" role="img" aria-label="찜을 누르면 화면이 서버 답을 기다리지 않고 먼저 바뀌고, 요청이 성공하면 그대로 확정되며, 실패하면 원래대로 되돌리고 빨간 토스트로 알린다" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" style="fill:var(--ink,#3e2a1f)">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink-soft,#5c4334)"/></marker>
    <marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--cta,#c8643a)"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--chip-mint-fg,#2e5e4c)"/></marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--chip-rose-fg,#7d3a3f)"/></marker>
  </defs>
  <rect width="760" height="396" rx="14" style="fill:var(--fig-bg,#fffaf4)"/>
  <text x="744" y="24" text-anchor="end" font-size="12" style="fill:var(--ink-mute,#8a7262)">시간 →</text>

  <!-- 줄 -->
  <g style="stroke:var(--box-line,#e3cbb5)" stroke-width="1.3" stroke-dasharray="4 4">
    <line x1="122" y1="62" x2="744" y2="62"/>
    <line x1="122" y1="178" x2="744" y2="178"/>
    <line x1="122" y1="312" x2="744" y2="312"/>
  </g>
  <g font-weight="700" text-anchor="middle" font-size="12.5">
    <rect x="16" y="47" width="96" height="30" rx="15" style="fill:var(--chip-butter-bg,#f3e6be)"/>
    <text x="64" y="67" style="fill:var(--chip-butter-fg,#6b5410)">사용자</text>
    <rect x="16" y="163" width="96" height="30" rx="15" style="fill:var(--chip-clay-bg,#f1dccb)"/>
    <text x="64" y="183" style="fill:var(--chip-clay-fg,#7e3b22)">화면 · 캐시</text>
    <rect x="16" y="297" width="96" height="30" rx="15" style="fill:var(--chip-sky-bg,#d9e6ec)"/>
    <text x="64" y="317" style="fill:var(--chip-sky-fg,#2f5868)">서버</text>
  </g>

  <!-- 1 누름 -->
  <circle cx="146" cy="62" r="12" style="fill:var(--cta,#c8643a)"/>
  <text x="146" y="67" text-anchor="middle" font-weight="700" style="fill:var(--on-strong,#fbf4ec)">1</text>
  <text x="166" y="58" font-weight="700">하트(찜) 누름</text>
  <text x="166" y="76" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">모임 상세 화면</text>
  <line x1="146" y1="76" x2="146" y2="140" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="152" y="114" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">클릭</text>

  <!-- 2 화면 먼저 -->
  <rect x="126" y="142" width="204" height="72" rx="10" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
  <circle cx="146" cy="162" r="12" style="fill:var(--cta,#c8643a)"/>
  <text x="146" y="167" text-anchor="middle" font-weight="700" style="fill:var(--on-strong,#fbf4ec)">2</text>
  <text x="166" y="167" font-weight="700">화면 먼저 바꿈</text>
  <text x="142" y="188" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">캐시(기억한 값)를 먼저 고침</text>
  <text x="142" y="205" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">하트 켜짐 · 찜 수 +1</text>
  <line x1="304" y1="140" x2="304" y2="80" style="stroke:var(--cta,#c8643a)" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ahc)"/>
  <text x="312" y="104" font-size="12" font-weight="700" style="fill:var(--cta,#c8643a)">바로 보임</text>
  <text x="312" y="121" font-size="11.5" style="fill:var(--cta,#c8643a)">서버를 기다리지 않음</text>

  <!-- 3 요청 -->
  <circle cx="360" cy="178" r="12" style="fill:var(--cta,#c8643a)"/>
  <text x="360" y="183" text-anchor="middle" font-weight="700" style="fill:var(--on-strong,#fbf4ec)">3</text>
  <line x1="360" y1="192" x2="360" y2="294" style="stroke:var(--ink-soft,#5c4334)" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="372" y="240" font-weight="700" font-size="12.5">요청 보냄</text>
  <text x="372" y="257" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">PUT /api/v1/meetups/{id}/like</text>

  <!-- 4 서버 -->
  <rect x="346" y="296" width="398" height="44" rx="10" style="fill:var(--box,#f4e6d8);stroke:var(--box-line,#e3cbb5)"/>
  <circle cx="368" cy="318" r="12" style="fill:var(--cta,#c8643a)"/>
  <text x="368" y="323" text-anchor="middle" font-weight="700" style="fill:var(--on-strong,#fbf4ec)">4</text>
  <text x="388" y="314" font-weight="700">처리 · 저장</text>
  <text x="388" y="331" font-size="11.5" style="fill:var(--ink-soft,#5c4334)">지금은 목 서버가 0.15~0.4초 기다렸다 답함</text>

  <!-- 5 결과 -->
  <line x1="566" y1="294" x2="566" y2="226" style="stroke:var(--chip-mint-fg,#2e5e4c)" stroke-width="1.6" marker-end="url(#ahg)"/>
  <text x="558" y="280" text-anchor="end" font-size="12" font-weight="700" style="fill:var(--chip-mint-fg,#2e5e4c)">성공</text>
  <line x1="620" y1="294" x2="620" y2="226" style="stroke:var(--chip-rose-fg,#7d3a3f)" stroke-width="1.6" marker-end="url(#ahr)"/>
  <text x="628" y="280" font-size="12" font-weight="700" style="fill:var(--chip-rose-fg,#7d3a3f)">실패 + 에러 내용</text>

  <rect x="430" y="136" width="150" height="88" rx="10" style="fill:var(--chip-mint-bg,#d5e8df)"/>
  <g style="fill:var(--chip-mint-fg,#2e5e4c)">
    <text x="444" y="158" font-weight="700">5-가 성공</text>
    <text x="444" y="179" font-size="11.5">바뀐 화면 그대로</text>
    <text x="444" y="196" font-size="11.5">서버 값을 새로 받아</text>
    <text x="444" y="213" font-size="11.5">확정</text>
  </g>
  <rect x="594" y="136" width="150" height="88" rx="10" style="fill:var(--chip-rose-bg,#f2d9d9)"/>
  <g style="fill:var(--chip-rose-fg,#7d3a3f)">
    <text x="608" y="158" font-weight="700">5-나 실패</text>
    <text x="608" y="179" font-size="11.5">원래대로 되돌림</text>
    <text x="608" y="196" font-size="11.5">빨간 토스트에</text>
    <text x="608" y="213" font-size="11.5">code로 고른 문구</text>
  </g>

  <!-- 덧붙임 -->
  <text x="16" y="364" font-size="12" style="fill:var(--ink-soft,#5c4334)">· 성공 · 실패 모두 끝나면 관련 캐시를 서버 값으로 다시 받는다 (실패해 되돌린 뒤에도. 사건 29)</text>
  <text x="16" y="384" font-size="12" style="fill:var(--ink-soft,#5c4334)">· 신청하기 · 대화 요청 보내기 · 수락 버튼은 요청이 끝날 때까지 다시 누를 수 없다</text>
</svg>
