<title>잇팅 프로토타입</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  /* Layout: 앱 셸 — 좌측 내비 + 3D 방 스테이지 중심 화면 + 우측 기획 노트 서랍. 모바일은 하단 탭바 */
  /* Color — Moss(차분함·신뢰, 주요 동작) + Lamp(방 안의 따뜻한 불빛, 명함·공감·알림에만) */
  --bg:#F1F4F0; --surface:#FFFFFF; --surface-2:#E7ECE6; --line:#D4DCD3;
  --ink:#1B2620; --ink-2:#4D5B53; --ink-3:#7D8A82;
  --moss:#2F6F55; --moss-strong:#245A45; --moss-soft:#DDEBE3; --on-moss:#FFFFFF;
  --lamp:#EFA92A; --lamp-soft:#FCEFD3; --on-lamp:#2B1D00;
  --ok:#2F8F5B; --warn:#B7790C; --danger:#C2463D; --danger-soft:#F8E1DE;
  /* 관심사 카테고리 8색 — 태그 칩, 벌집 마을, 방 소품에 일관 적용 */
  --cat-music:#8F56BA; --cat-photo:#2C7DB8; --cat-nature:#6F8F22; --cat-game:#D9573A;
  --cat-craft:#C94F92; --cat-book:#5361C4; --cat-science:#23909C; --cat-food:#AD6C2E; --cat-basic:#7D8A82;
  --on-cat:#FFFFFF;
  --stage-top:#DCE6DF; --stage-bottom:#F4F7F3; --scrim:rgb(17 26 21 / .42);
  --shadow-1:0 1px 2px rgb(22 40 31 / .06), 0 2px 8px rgb(22 40 31 / .05);
  --shadow-2:0 2px 6px rgb(22 40 31 / .08), 0 18px 44px rgb(22 40 31 / .16);
  /* Type — Hahmlet(방 이름·화면 제목, 이야기책 같은 결) / IBM Plex Sans KR(본문·UI) / IBM Plex Mono(수치·토큰) */
  --font-display:"Hahmlet","Noto Serif KR","Nanum Myeongjo",serif;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
  --r-sm:6px; --r-md:10px; --r-lg:16px; --r-pill:999px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111613; --surface:#19201C; --surface-2:#222B26; --line:#2E3933;
    --ink:#E6EDE8; --ink-2:#A9B5AE; --ink-3:#7A867F;
    --moss:#6CC29A; --moss-strong:#8AD3B0; --moss-soft:#1F3A2E; --on-moss:#0E1A14;
    --lamp:#F5BE4F; --lamp-soft:#3A2F16; --on-lamp:#221700;
    --ok:#5CC48A; --warn:#E2A63B; --danger:#E87A70; --danger-soft:#3D1F1C;
    --cat-music:#B98BDE; --cat-photo:#6AAFE0; --cat-nature:#A3C152; --cat-game:#F08A6C;
    --cat-craft:#E886BD; --cat-book:#8C97E6; --cat-science:#5CC3CD; --cat-food:#D99A5C; --cat-basic:#8D9A92;
    --on-cat:#10150F;
    --stage-top:#18211C; --stage-bottom:#0F1411; --scrim:rgb(0 0 0 / .6);
    --shadow-1:0 1px 2px rgb(0 0 0 / .3), 0 2px 8px rgb(0 0 0 / .25);
    --shadow-2:0 2px 6px rgb(0 0 0 / .35), 0 18px 44px rgb(0 0 0 / .5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#19201C; --surface-2:#222B26; --line:#2E3933;
  --ink:#E6EDE8; --ink-2:#A9B5AE; --ink-3:#7A867F;
  --moss:#6CC29A; --moss-strong:#8AD3B0; --moss-soft:#1F3A2E; --on-moss:#0E1A14;
  --lamp:#F5BE4F; --lamp-soft:#3A2F16; --on-lamp:#221700;
  --ok:#5CC48A; --warn:#E2A63B; --danger:#E87A70; --danger-soft:#3D1F1C;
  --cat-music:#B98BDE; --cat-photo:#6AAFE0; --cat-nature:#A3C152; --cat-game:#F08A6C;
  --cat-craft:#E886BD; --cat-book:#8C97E6; --cat-science:#5CC3CD; --cat-food:#D99A5C; --cat-basic:#8D9A92;
  --on-cat:#10150F;
  --stage-top:#18211C; --stage-bottom:#0F1411; --scrim:rgb(0 0 0 / .6);
  --shadow-1:0 1px 2px rgb(0 0 0 / .3), 0 2px 8px rgb(0 0 0 / .25);
  --shadow-2:0 2px 6px rgb(0 0 0 / .35), 0 18px 44px rgb(0 0 0 / .5);
  color-scheme:dark;
}

/* ---------- 기본 ---------- */
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
*,*::before,*::after{box-sizing:border-box}
h1,h2,h3,p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--moss);outline-offset:2px}
svg{flex:none}

/* 타입 스케일 */
.t-display{font-family:var(--font-display);font-weight:600;font-size:2rem;line-height:1.25;letter-spacing:-.01em;text-wrap:balance}
.t-h1{font-family:var(--font-display);font-weight:700;font-size:1.5rem;line-height:1.33;letter-spacing:-.01em;text-wrap:balance}
.t-h2{font-weight:600;font-size:1.25rem;line-height:1.4;text-wrap:balance}
.t-h3{font-weight:600;font-size:1.0625rem;line-height:1.45}
.t-body{font-size:.9375rem;line-height:1.6}
.t-small{font-size:.8125rem;line-height:1.55}
.t-label,.eyebrow,.field-label{font-size:.75rem;line-height:1.35;font-weight:600;letter-spacing:.02em;color:var(--ink-2)}
.mono{font-family:var(--font-mono);font-weight:500;font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.lead{color:var(--ink-2);max-width:60ch}

/* 아이콘 */
.ic,.btn svg,.icon-btn svg,.nav-item svg,.tab svg,.seg-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- 앱 셸 ---------- */
.app{height:100%;display:grid;grid-template-columns:228px minmax(0,1fr);gap:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.app.is-bare{grid-template-columns:minmax(0,1fr)}
.app.is-bare .nav{display:none}
.nav{display:flex;flex-direction:column;gap:2px;padding:20px 12px 84px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);min-height:0;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;padding:0 8px}
.brand svg{width:32px;height:32px}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:1.375rem;letter-spacing:-.02em}
.brand-tag{font-size:.75rem;color:var(--ink-2);padding:4px 8px 18px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-md);text-decoration:none;color:var(--ink-2);font-weight:500}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item.is-on{background:var(--moss-soft);color:var(--moss-strong);font-weight:600}
.nav-item .badge{margin-left:auto}
.nav-sep{height:1px;background:var(--line);margin:10px 8px}
.main{min-width:0;min-height:0;position:relative}
.view{height:100%;display:none;flex-direction:column;min-height:0;gap:12px}
.view.is-active{display:flex}
.view.scroll{overflow:auto}
.tabbar{display:none}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:var(--r-pill);background:var(--lamp);color:var(--on-lamp);font:600 .6875rem/1 var(--font-mono)}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);padding-block:12px calc(80px + env(safe-area-inset-bottom,0px))}
  .app.is-bare{padding-block:12px}
  .nav{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;justify-content:space-around;gap:4px;background:var(--surface);border-top:1px solid var(--line);padding:6px max(12px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
  .app.is-bare ~ .tabbar{display:none}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:var(--r-md);text-decoration:none;color:var(--ink-3);font-size:.6875rem;font-weight:600;position:relative}
  .tab.is-on{color:var(--moss)}
  .tab .badge{position:absolute;top:0;left:calc(50% + 6px);min-width:16px;height:16px;font-size:.625rem}
  .view.mobile-scroll{overflow:auto}
}

/* ---------- 버튼 · 입력 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:.875rem;white-space:nowrap;text-decoration:none;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--moss);border-color:var(--moss);color:var(--on-moss)}
.btn-primary:hover{background:var(--moss-strong);border-color:var(--moss-strong)}
.btn-lamp{background:var(--lamp);border-color:var(--lamp);color:var(--on-lamp)}
.btn-lamp:hover{background:var(--lamp);filter:brightness(.95)}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.btn-danger:hover{background:var(--danger);filter:brightness(.94)}
.btn-sm{height:32px;padding:0 12px;font-size:.8125rem}
.btn.block{width:100%}
.btn.is-on{background:var(--lamp-soft);border-color:var(--lamp);color:var(--ink)}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:var(--r-md);border:0;background:transparent;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:10px 12px;font-size:.9375rem;line-height:1.5;resize:vertical}
.field input:focus,.field textarea:focus{outline:2px solid var(--moss);outline-offset:0;border-color:transparent}
.check{display:flex;align-items:flex-start;gap:10px;font-size:.875rem}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--moss)}

/* 칩 */
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{--c:var(--cat-basic);display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:var(--r-pill);font-size:.8125rem;font-weight:500;background:color-mix(in srgb,var(--c) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 28%,transparent);color:var(--ink);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--c)}
.chip .cnt{font:500 .6875rem/1 var(--font-mono);color:var(--ink-2)}
.chip .rare{font-size:.625rem;font-weight:700;padding:2px 6px;border-radius:var(--r-pill);background:var(--lamp-soft);color:var(--ink)}
.chip.is-common{border-color:var(--moss);box-shadow:inset 0 0 0 1px var(--moss)}
.chip .common-mark{font-size:.625rem;font-weight:700;color:var(--moss)}
button.chip{cursor:pointer}
button.chip:hover{background:color-mix(in srgb,var(--c) 20%,var(--surface))}
button.chip.is-on{background:var(--c);border-color:var(--c);color:var(--on-cat)}
button.chip.is-on .dot{background:var(--on-cat)}
button.chip.is-on .cnt{color:var(--on-cat);opacity:.85}
[data-cat="music"]{--c:var(--cat-music)}[data-cat="photo"]{--c:var(--cat-photo)}[data-cat="nature"]{--c:var(--cat-nature)}[data-cat="game"]{--c:var(--cat-game)}[data-cat="craft"]{--c:var(--cat-craft)}[data-cat="book"]{--c:var(--cat-book)}[data-cat="science"]{--c:var(--cat-science)}[data-cat="food"]{--c:var(--cat-food)}[data-cat="basic"]{--c:var(--cat-basic)}

/* 아바타 점 · 접속 표시 */
.av-dot{--pc:#5B8DEF;position:relative;display:inline-block;width:40px;height:40px;border-radius:50%;background:var(--pc);flex:none;box-shadow:inset 0 -8px 0 rgb(0 0 0 / .12)}
.av-dot::after{content:"";position:absolute;left:50%;top:22%;width:46%;height:46%;transform:translateX(-50%);border-radius:50%;background:color-mix(in srgb,var(--pc) 45%,#fff)}
.av-dot.sm{width:28px;height:28px}
.av-dot.xs{width:22px;height:22px}
.presence{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;color:var(--ink-2)}
.presence i,.on-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.presence.on i,.on-dot{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}

/* ---------- 온보딩 ---------- */
.ob{height:100%;overflow:auto;display:grid;grid-template-rows:auto 1fr;gap:20px;max-width:1080px;margin:0 auto;width:100%}
.ob-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:8px}
.ob-steps{display:flex;gap:6px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.ob-steps li{display:flex;align-items:center;gap:8px;font-size:.8125rem;font-weight:600;color:var(--ink-3);padding:6px 12px 6px 6px;border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--line)}
.ob-steps li b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--surface-2);font:600 .75rem/1 var(--font-mono)}
.ob-steps li.is-on{color:var(--ink);border-color:var(--moss)}
.ob-steps li.is-on b{background:var(--moss);color:var(--on-moss)}
.ob-steps li.is-done b{background:var(--moss-soft);color:var(--moss-strong)}
.ob-card{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;align-self:start}
.ob-card.single{grid-template-columns:minmax(0,1fr)}
.ob-pane{display:flex;flex-direction:column;gap:20px;padding:36px}
.ob-side{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:36px;background:linear-gradient(180deg,var(--stage-top),var(--stage-bottom));text-align:center}
.ob-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding-top:4px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{--sw:#999;width:36px;height:36px;border-radius:50%;border:3px solid var(--surface);background:var(--sw);box-shadow:0 0 0 1px var(--line)}
.sw.is-on{box-shadow:0 0 0 2px var(--ink)}
.pawn{--pc:#5B8DEF;position:relative;width:120px;height:150px}
.pawn i{position:absolute;left:50%;bottom:0;width:96px;height:96px;transform:translateX(-50%);border-radius:48px 48px 20px 20px;background:var(--pc);box-shadow:inset 0 -14px 0 rgb(0 0 0 / .12)}
.pawn b{position:absolute;left:50%;top:0;width:76px;height:76px;transform:translateX(-50%);border-radius:50%;background:color-mix(in srgb,var(--pc) 45%,#fff);box-shadow:inset -6px -6px 0 rgb(0 0 0 / .05)}
.pawn b::before,.pawn b::after{content:"";position:absolute;top:44%;width:7px;height:7px;border-radius:50%;background:#1B1F22}
.pawn b::before{left:32%}.pawn b::after{right:32%}
.pawn-name{font-family:var(--font-display);font-weight:600;font-size:1.25rem}
.tag-groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px 20px}
.tag-group{display:flex;flex-direction:column;gap:8px}
.parse{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:var(--r-md);background:var(--surface-2)}
.parse .chip small{font-size:.6875rem;color:var(--ink-2)}
.gen-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.gen-steps li{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-weight:500}
.gen-steps li::before{content:"";width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none}
.gen-steps li.is-doing{color:var(--ink)}
.gen-steps li.is-doing::before{border-color:var(--moss);border-right-color:transparent;animation:spin .8s linear infinite}
.gen-steps li.is-done{color:var(--ink)}
.gen-steps li.is-done::before{background:var(--moss);border-color:var(--moss);box-shadow:inset 0 0 0 3px var(--surface)}
@keyframes spin{to{transform:rotate(360deg)}}
.map-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.map-list li{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,auto);gap:10px;align-items:center;padding:10px 12px;border-radius:var(--r-md);background:var(--surface-2);font-size:.875rem;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s}
.map-list li.is-in{opacity:1;transform:none}
.map-list .src{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.map-list img{width:36px;height:36px}
.map-list b{display:flex;align-items:center;gap:6px}

/* ---------- 방 화면 공통 ---------- */
.room-head{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap}
.rh-main{display:flex;align-items:center;gap:12px;min-width:0}
.rh-main > div{min-width:0}
.room-title{font-family:var(--font-display)}
.rh-bio{color:var(--ink-2);font-size:.875rem;max-width:44ch}
.rh-tags{flex:1 1 260px}
.rh-meta{display:flex;gap:14px;color:var(--ink-2)}
.rh-meta b{color:var(--ink);margin-right:4px}
.rh-actions{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.eyebrow{display:flex;align-items:center;gap:6px}
.stage-wrap{position:relative;flex:1;min-height:380px;border-radius:var(--r-lg);overflow:hidden;background:linear-gradient(180deg,var(--stage-top),var(--stage-bottom));border:1px solid var(--line)}
.stage{position:absolute;inset:0}
.stage canvas{display:block;width:100%;height:100%}
.stage-fail{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink-2)}
.stage-hint{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:calc(100% - 24px);padding:6px 12px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--surface) 88%,transparent);font-size:.75rem;color:var(--ink-2);pointer-events:none;backdrop-filter:blur(6px)}
.stage-tip{position:absolute;left:0;top:0;pointer-events:none;padding:5px 10px;border-radius:var(--r-sm);background:var(--ink);color:var(--bg);font-size:.75rem;font-weight:600;white-space:nowrap;z-index:3}
.sel-tools{position:absolute;left:50%;top:56px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:4px 4px 4px 14px;border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-2);z-index:4;max-width:calc(100% - 24px)}
.sel-tools .sel-name{font-size:.8125rem;font-weight:600;margin-right:6px;white-space:nowrap}
.sel-tools button{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;border:0;border-radius:var(--r-pill);background:transparent;font-size:.8125rem;font-weight:600;color:var(--ink-2)}
.sel-tools button:hover{background:var(--surface-2);color:var(--ink)}
.sel-tools button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sel-tools button.danger:hover{color:var(--danger);background:var(--danger-soft)}

/* 시트(사연 · 명함함) */
.sheet{position:absolute;right:12px;top:12px;bottom:12px;width:min(360px,calc(100% - 24px));display:flex;flex-direction:column;gap:14px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-2);overflow:auto;z-index:5}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.sheet-head .eyebrow{color:var(--c,var(--ink-2))}
.sheet-icon{width:96px;height:96px;align-self:center}
.story{margin:0;padding:14px 16px;border-radius:var(--r-md);background:var(--surface-2);font-size:.9375rem;line-height:1.7;position:relative}
.story.empty{color:var(--ink-2)}
.draft-tag{display:inline-block;font-size:.6875rem;font-weight:700;padding:2px 8px;border-radius:var(--r-pill);background:var(--lamp-soft);margin-bottom:6px}
.sheet-actions{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
.starters{display:flex;flex-direction:column;gap:6px}
.starter{text-align:left;padding:9px 12px;border-radius:var(--r-md);border:1px dashed var(--line);background:transparent;font-size:.8125rem}
.starter:hover{border-style:solid;border-color:var(--moss);background:var(--moss-soft)}
.big-num{font-family:var(--font-display);font-size:2rem;font-weight:700}
.card-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.mini-card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:12px;border-radius:var(--r-md);background:var(--lamp-soft);border:1px solid color-mix(in srgb,var(--lamp) 40%,transparent)}
.mini-card b{font-size:.875rem}
.mini-card p{font-size:.8125rem;color:var(--ink-2)}
.mini-card .btn{grid-column:1 / -1;justify-self:start}

/* 제스처 바 */
.emote-bar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-2);z-index:4;max-width:calc(100% - 24px);overflow-x:auto}
.emote{display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border:0;border-radius:var(--r-pill);background:transparent;font-size:.8125rem;font-weight:600;color:var(--ink-2);white-space:nowrap}
.emote:hover{background:var(--lamp-soft);color:var(--ink)}
.emote .em{font-size:1.25rem;line-height:1}
.emote.pop{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.15)}}

/* 꾸미기 패널 */
.edit-panel{position:absolute;left:12px;right:12px;bottom:12px;display:flex;flex-direction:column;gap:10px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-2);z-index:4;max-height:48%}
.ep-tabs{display:flex;gap:4px;align-items:center}
.ep-tab{height:32px;padding:0 12px;border:0;border-radius:var(--r-pill);background:transparent;font-size:.8125rem;font-weight:600;color:var(--ink-2)}
.ep-tab.is-on{background:var(--ink);color:var(--bg)}
.ep-body{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px}
.ep-filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.ep-filters .chip{flex:none}
.tiles{display:grid;grid-auto-flow:column;grid-auto-columns:96px;gap:8px;overflow-x:auto;padding-bottom:4px}
.tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);font-size:.75rem;font-weight:600;text-align:center}
.tile:hover{border-color:var(--moss);background:var(--moss-soft)}
.tile img{width:64px;height:64px}
.tile .ph{width:64px;height:64px;border-radius:var(--r-sm);background:var(--surface-2)}
.sf-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sf-row .field-label{width:40px}
.sf{width:44px;height:44px;border-radius:var(--r-md);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);display:grid;place-items:end center;font-size:.625rem;font-weight:600;padding-bottom:2px}
.sf.is-on{box-shadow:0 0 0 2px var(--ink)}

/* ---------- 페이지형 화면 ---------- */
.page{display:flex;flex-direction:column;gap:20px;max-width:1120px;width:100%;margin:0 auto;padding-bottom:24px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head > div{display:flex;flex-direction:column;gap:6px}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:var(--r-pill);background:var(--surface-2);align-self:flex-start}
.seg-btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border:0;border-radius:var(--r-pill);background:transparent;font-size:.875rem;font-weight:600;color:var(--ink-2)}
.seg-btn.is-on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.seg-btn svg{width:18px;height:18px}
.exp{font-size:.625rem;font-weight:700;padding:2px 6px;border-radius:var(--r-pill);background:var(--lamp-soft);color:var(--ink)}
.search{position:relative}
.search input{width:100%;height:48px;padding:0 16px 0 44px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);font-size:.9375rem}
.search-ic{position:absolute;left:14px;top:14px;color:var(--ink-3)}
.search-ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}
.filter-row{display:flex;flex-direction:column;gap:8px}
.filter-row .chips .field-label{margin-right:4px}
.result-meta{font-size:.8125rem;color:var(--ink-2)}
.result-meta b{color:var(--ink)}
.room-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.room-card{display:flex;flex-direction:column;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;text-align:left}
.room-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-2)}
.rc-thumb{position:relative;aspect-ratio:400 / 280;max-width:100%;background:linear-gradient(180deg,var(--stage-top),var(--stage-bottom))}
.rc-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.rc-thumb .presence{position:absolute;left:10px;top:10px;padding:4px 10px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--surface) 90%,transparent)}
.rc-body{display:flex;flex-direction:column;gap:10px;padding:14px 16px 16px}
.rc-top{display:flex;align-items:center;gap:8px}
.rc-bio{font-size:.8125rem;color:var(--ink-2)}
.rc-rare{font-size:.75rem;color:var(--ink-2);padding-top:10px;border-top:1px solid var(--line)}
.rc-rare b{color:var(--ink)}
.empty-state{padding:40px 16px;text-align:center;color:var(--ink-2);border:1px dashed var(--line);border-radius:var(--r-lg)}

/* 벌집 마을 */
.hive-wrap{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:20px;align-items:start}
.hive-info{display:flex;flex-direction:column;gap:12px;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.legend{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:.75rem}
.legend li{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;background:var(--c)}
.hive-scroll{overflow-x:auto;background:linear-gradient(180deg,var(--stage-top),var(--stage-bottom));border:1px solid var(--line);border-radius:var(--r-lg);padding:12px}
.hive-scroll svg{display:block;width:100%;min-width:520px;height:auto}
.hex polygon{stroke:var(--surface);stroke-width:3;transition:transform .15s}
.hex text{font-family:var(--font-body);text-anchor:middle;fill:var(--ink);pointer-events:none}
.hex .hx-name{font-size:12.5px;font-weight:600}
.hex .hx-tag{font-size:10.5px;fill:var(--ink-2)}
.hex[data-room]{cursor:pointer}
.hex[data-room]:hover polygon,.hex[data-room]:focus polygon{stroke:var(--moss);stroke-width:3}
.hex[data-room]:focus{outline:none}
.hex.me polygon{fill:var(--moss)}
.hex.me text{fill:var(--on-moss)}
.hex.empty polygon{fill:transparent;stroke:var(--line);stroke-dasharray:4 4;stroke-width:1.5}
.hex.empty text{fill:var(--ink-3)}

/* ---------- 분할 레이아웃(대화 · 모임) ---------- */
.split{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;height:100%;min-height:0}
.split-list{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.split-main{display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.list-head{display:flex;flex-direction:column;gap:4px}
.list-head-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.thread-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.thread{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;width:100%;padding:10px;border:0;border-radius:var(--r-md);background:transparent;text-align:left}
.thread:hover{background:var(--surface-2)}
.thread.is-on{background:var(--moss-soft)}
.th-body{display:flex;flex-direction:column;gap:2px;min-width:0}
.th-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.th-last{font-size:.8125rem;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th-origin{font-size:.6875rem;font-weight:600;color:var(--moss)}
.main-head{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.main-head .mh-title{display:flex;flex-direction:column;min-width:0;flex:1}
.main-head .mh-title b{font-size:1rem}
.main-head .back-btn{display:none}
.mh-actions{display:flex;gap:4px;align-items:center;position:relative}
.menu{position:absolute;right:0;top:44px;z-index:10;display:flex;flex-direction:column;min-width:160px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-2)}
.menu button{text-align:left;padding:9px 12px;border:0;border-radius:var(--r-sm);background:transparent;font-size:.875rem}
.menu button:hover{background:var(--surface-2)}
.menu button.danger{color:var(--danger)}
.msgs{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:18px 16px}
.msg{display:flex;gap:8px;max-width:78%;align-items:flex-end}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.bubble{padding:9px 13px;border-radius:16px;background:var(--surface-2);font-size:.9375rem;line-height:1.55;overflow-wrap:anywhere}
.msg.me .bubble{background:var(--moss);color:var(--on-moss);border-bottom-right-radius:6px}
.msg.them .bubble{border-bottom-left-radius:6px}
.msg .who{font-size:.6875rem;font-weight:600;color:var(--ink-2);margin-bottom:2px}
.sys{align-self:center;font-size:.75rem;color:var(--ink-2);padding:4px 12px;border-radius:var(--r-pill);background:var(--surface-2);text-align:center}
.sys.lamp{background:var(--lamp-soft);color:var(--ink)}
.quote-card{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;padding:10px 12px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);max-width:340px;color:var(--ink)}
.quote-card img{width:56px;height:56px}
.quote-card p{font-size:.8125rem;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.typing{display:inline-flex;gap:4px;padding:12px 14px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.25}}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.composer input{flex:1;min-width:0;height:44px;padding:0 14px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--surface-2);font-size:.9375rem}
.composer .btn{width:44px;height:44px;padding:0;border-radius:50%}
.blocked{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:14px;border-top:1px solid var(--line);background:var(--danger-soft);font-size:.875rem}
.main-empty{flex:1;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink-2)}

/* 모임 */
.group-item{display:flex;flex-direction:column;gap:8px;width:100%;padding:14px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);text-align:left}
.group-item:hover{border-color:var(--moss)}
.group-item.is-on{border-color:var(--moss);background:var(--moss-soft)}
.gi-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gi-desc{font-size:.8125rem;color:var(--ink-2)}
.gi-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.75rem;color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:var(--r-pill);font-size:.6875rem;font-weight:700;background:var(--surface-2);color:var(--ink-2)}
.pill.lamp{background:var(--lamp-soft);color:var(--ink)}
.pill.moss{background:var(--moss-soft);color:var(--moss-strong)}
.pill svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.members{display:flex}
.members .av-dot{margin-left:-6px;border:2px solid var(--surface)}
.members .av-dot:first-child{margin-left:0}
.lurk{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface-2);font-size:.8125rem;flex-wrap:wrap}
.switch{position:relative;width:40px;height:24px;border-radius:12px;border:0;background:var(--line);flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:var(--shadow-1)}
.switch[aria-checked="true"]{background:var(--moss)}
.switch[aria-checked="true"]::after{transform:translateX(16px)}
.event{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:var(--r-md);background:var(--lamp-soft);border:1px solid color-mix(in srgb,var(--lamp) 45%,transparent);align-self:stretch;max-width:420px}
.event .ev-row{display:flex;align-items:center;gap:8px;font-size:.875rem}
.event .ev-row svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;color:var(--ink-2)}
.event .ev-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-top:4px}
.event .ev-foot > div{display:flex;gap:6px}
.join-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line)}

/* ---------- 디자인 시스템 ---------- */
.ds-section{display:flex;flex-direction:column;gap:14px;padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.ds-section > header{display:flex;flex-direction:column;gap:4px}
.ds-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.ds-sw{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.ds-sw .chipcolor{height:64px}
.ds-sw .meta{display:flex;flex-direction:column;gap:2px;padding:10px 12px}
.ds-sw .meta b{font-size:.875rem}
.ds-sw .meta code{font:500 .6875rem/1.4 var(--font-mono);color:var(--ink-2)}
.ds-sw .meta span{font-size:.75rem;color:var(--ink-2)}
.ds-group-title{font-weight:600;font-size:.875rem;padding-top:6px}
.ds-type{display:flex;flex-direction:column}
.ds-type-row{display:grid;grid-template-columns:180px minmax(0,1fr);gap:16px;align-items:baseline;padding:14px 0;border-top:1px solid var(--line)}
.ds-type-row:first-child{border-top:0}
.ds-type-row .spec{display:flex;flex-direction:column;gap:2px}
.ds-type-row .spec b{font-size:.875rem}
.ds-type-row .spec code{font:500 .6875rem/1.4 var(--font-mono);color:var(--ink-2)}
.ds-type-row .sample{min-width:0;overflow-wrap:anywhere}
.ds-fonts{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.ds-font{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:var(--r-md);background:var(--surface-2)}
.ds-font .big{font-size:2.5rem;line-height:1.1}
.ds-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ds-scale{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.ds-scale div{display:flex;flex-direction:column;align-items:center;gap:4px;font:500 .6875rem var(--font-mono);color:var(--ink-2)}
.ds-scale i{display:block;background:var(--moss-soft);border:1px solid var(--moss)}
.ds-principles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin:0;padding:0;list-style:none}
.ds-principles li{padding:14px;border-radius:var(--r-md);background:var(--surface-2);font-size:.875rem}
.ds-principles b{display:block;margin-bottom:4px}

/* ---------- 모달 · 토스트 · 기획 노트 ---------- */
.modal-layer{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:var(--scrim)}
.dialog{width:min(480px,100%);max-height:calc(100% - 32px);overflow:auto;display:flex;flex-direction:column;gap:16px;padding:22px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-2)}
.dlg-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.radio-list{display:flex;flex-direction:column;gap:8px}
.radio-list label{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-md);font-size:.875rem;cursor:pointer}
.radio-list input{accent-color:var(--moss)}
.bizcard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;padding:16px;border-radius:var(--r-md);background:var(--lamp-soft);border:1px solid color-mix(in srgb,var(--lamp) 45%,transparent)}
.bizcard > div{display:flex;flex-direction:column;gap:8px}
.bc-msg{font-size:.875rem;color:var(--ink-2)}
.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(440px,calc(100% - 32px));pointer-events:none}
.toast{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--r-md);background:var(--ink);color:var(--bg);font-size:.875rem;box-shadow:var(--shadow-2);pointer-events:auto;animation:toastIn .25s ease}
.toast.out{opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s}
.toast-act{margin-left:auto;border:0;background:transparent;color:var(--lamp);font-weight:700;font-size:.8125rem}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}}
.notes-fab{position:fixed;left:calc(max(16px,env(safe-area-inset-left,0px)) + 12px);bottom:calc(28px + env(safe-area-inset-bottom,0px));z-index:35;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:var(--r-pill);border:1px solid color-mix(in srgb,var(--lamp) 55%,transparent);background:var(--lamp-soft);color:var(--ink);font-weight:600;font-size:.875rem;box-shadow:var(--shadow-1)}
.notes-fab svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.notes{position:fixed;top:16px;bottom:16px;right:max(16px,env(safe-area-inset-right,0px));z-index:40;width:min(380px,calc(100% - 32px));display:flex;flex-direction:column;gap:16px;padding:22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-2);overflow:auto;transform:translateX(calc(100% + 40px));transition:transform .25s ease;visibility:hidden}
.notes.is-open{transform:none;visibility:visible}
.notes-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.notes ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:.875rem}
.diffs{display:flex;flex-direction:column;gap:6px}
.diff{display:flex;align-items:center;gap:8px;font-size:.8125rem;padding:8px 10px;border-radius:var(--r-md);background:var(--surface-2);color:var(--ink-3)}
.diff b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--ink-2);font:600 .75rem/1 var(--font-mono)}
.diff.is-on{background:var(--moss-soft);color:var(--ink)}
.diff.is-on b{background:var(--moss);color:var(--on-moss)}
.mvp{padding:14px;border-radius:var(--r-md);background:var(--lamp-soft);font-size:.8125rem;display:flex;flex-direction:column;gap:6px}

/* ---------- 2차: 관계 단계 · 넛지 · 방 기록 · 취미 상세 · 알림 ---------- */
span.chip[data-taglink]{cursor:pointer}
span.chip[data-taglink]:hover{background:color-mix(in srgb,var(--c) 22%,var(--surface))}
.rh-meta{flex-wrap:wrap}
.rh-meta button{display:inline-flex;align-items:baseline;gap:2px;border:0;background:transparent;padding:4px 8px;margin:-4px -8px;border-radius:var(--r-sm);color:var(--ink-2);font-size:.8125rem}

function toast(msg,act){
  const t=document.createElement('div'); t.className='toast'; t.innerHTML=`<span>${esc(msg)}</span>`;
  if(act){ const b=document.createElement('button'); b.className='toast-act'; b.textContent=act.label; b.onclick=()=>{act.fn(); t.remove();}; t.appendChild(b); }
  $('#toasts').appendChild(t);
  const life=act?4600:2800;
  setTimeout(()=>t.classList.add('out'),life-350); setTimeout(()=>t.remove(),life);
}
function modal(html,mount){
  const layer=$('#modal');

  layer.onclick=e=>{ if(e.target===layer) close(); };
  $$('[data-close]',layer).forEach(b=>b.onclick=close);
  if(mount) mount(layer.firstElementChild,close);
  const f=layer.querySelector('input,textarea'); if(f) f.focus();
  return close;
}

/* =========================================================
   방 자동 생성
   ========================================================= */
function parseFree(text){
  const out=[]; const seen=new Set();
  String(text||'').split(/[,.\n!?·]+/).map(s=>s.trim()).filter(Boolean).forEach(frag=>{
    KEYWORDS.forEach(([re,type])=>{ if(re.test(frag) && !seen.has(type)){ seen.add(type); out.push({type,frag}); } });
  });
  return out;
}
function generateRoom(me){
  const picks=[]; const seen=new Set();
  const add=(type,src,story,draft)=>{ if(seen.has(type)) return; seen.add(type); picks.push({type,src,story:story||'',draft:!!draft}); };
  parseFree(me.free).forEach(p=>add(p.type,`“${p.frag}”`,p.frag,true));
  me.tags.forEach(t=>{ if(TAG[t]) add(TAG[t].item,`#${t}`); });
  ['plant','bookshelf'].forEach(t=>{ if(picks.length<3) add(t,'기본 추천'); });
  const wallSlots=[[-2.6,-3.5,0],[-.5,-3.5,0],[-3.5,1.3,1],[-3.5,3.2,1]];
  const floorSlots=[[.3,.5,0],[1.4,2.6,0],[-1.3,2.9,0],[.6,-1.7,0]];
  const items=[...BASE(),it('desk',-3.5,-1,1),it('chair',-2.7,-1,3)];
  picks.slice(0,8).forEach(p=>{
    const first=WIDE.has(p.type)?wallSlots:floorSlots, second=WIDE.has(p.type)?floorSlots:wallSlots;
    const slot=first.shift()||second.shift(); if(!slot) return;
    const o=it(p.type,slot[0],slot[1],slot[2],p.story); o.draft=p.draft; if(LIKERS[p.type]){ o.likers=[...LIKERS[p.type]]; o.likes=o.likers.length; } items.push(o);
  });
  return {picks, room:{id:'me',nick:me.nick,color:me.color,tags:me.tags,wall:'#C9D6C4',floor:'#C79A6B',online:true,bio:me.free,visitors:[],
    cards:(S.me&&S.me.room?S.me.room.cards:MY_CARDS.map(c=>({...c}))),items}};
}
function applyOnboarding(){
  const ob=S.ob; const me={nick:ob.nick.trim()||'이름없음',color:ob.color,tags:[...ob.tags],free:ob.free};
  const g=generateRoom(me); S.picks=g.picks; S.me={...me,room:g.room};
}

  scene.add(new THREE.AmbientLight(0xffffff,.18));
  const sun=new THREE.DirectionalLight(0xfff3df,.72); sun.position.set(5,11,7); sun.castShadow=true; sun.shadow.mapSize.set(1024,1024);
  Object.assign(sun.shadow.camera,{left:-7,right:7,top:7,bottom:-7,near:1,far:40}); sun.shadow.camera.updateProjectionMatrix(); sun.shadow.bias=-.0008; scene.add(sun);
  const fill=new THREE.DirectionalLight(0xdfe9ff,.25); fill.position.set(-6,5,8); scene.add(fill);
  const shell=buildShell(room); scene.add(shell);
  const groups=new Map(); room.items.forEach(item=>{ const g=makeItemGroup(item,room); scene.add(g); groups.set(item.uid,g); });
  return {scene,shell,groups};
}

}

  Object.assign(cam,{left:-half*a,right:half*a,top:half,bottom:-half}); cam.position.set(11,10,11); cam.lookAt(0,.9,0); cam.updateProjectionMatrix();
  Object.values(ROOMS).forEach(r=>{ const b=buildRoomScene(r); R2.render(b.scene,cam); S.thumbs[r.id]=R2.domElement.toDataURL('image/png'); disposeTree(b.scene); });
  R2.setSize(160,160); R2.shadowMap.enabled=false;
  const sc=new THREE.Scene(); sc.add(new THREE.HemisphereLight(0xffffff,0x9a9384,.8)); sc.add(new THREE.AmbientLight(0xffffff,.2)); const dl=new THREE.DirectionalLight(0xffffff,.7); dl.position.set(5,10,7); sc.add(dl);
  Object.keys(CATALOG).forEach(t=>{
    const g=makeItemGroup({uid:'icon-'+t,type:t,x:0,z:0,rot:0},{color:'#5B8DEF',cards:[1,1,1,1]}); sc.add(g);
    const bb=new THREE.Box3().setFromObject(g), c=bb.getCenter(new THREE.Vector3()), s=bb.getSize(new THREE.Vector3()); const h=Math.max(s.x,s.y,s.z)*.62+.05;

const HINT_VIEW='물건을 누르면 사연이 보여요 · 바닥을 누르면 걸어가요 · 드래그해서 방을 돌려 보세요';
function enterMyRoom(){

  v.innerHTML=`<header class="room-head">

     <div class="rh-meta t-small"><button data-log="visits"><b class="mono">${MY_VISITS.length}</b>최근 다녀간 사람</button><button data-log="likes"><b class="mono">${likes}</b>받은 공감</button><button data-log="cards"><b class="mono">${r.cards.length}</b>받은 명함</button></div>

  $('#mr-here').onclick=e=>{ S.ownerHere=!S.ownerHere; e.currentTarget.setAttribute('aria-checked',S.ownerHere); $('#mr-here-l').textContent=S.ownerHere?'방에 있음 표시':'조용히 있기'; $('#mr-emotes').hidden=!S.ownerHere||S.editing;
    toast(S.ownerHere?'방문자에게 내가 방에 있다고 보여요':'조용히 있기를 켰어요. 방문자에게 내 아바타가 보이지 않고, 방문 기록은 그대로 남아요'); };

function setEditing(on){

function isDarkHex(c){ const n=parseInt(c.slice(1),16); return ((n>>16)*.299+((n>>8)&255)*.587+(n&255)*.114)<110; }

      <p class="t-small muted"><span class="mono">${item.likes||0}</span>명이 공감했어요${item.likers&&item.likers.length?` · ${item.likers.map(id=>esc(ROOMS[id].nick)).join(', ')}`:''}</p>

  $$('[data-lt]',sh).forEach(b=>b.onclick=()=>showLog(b.dataset.lt));
  $$('[data-visit]',sh).forEach(b=>b.onclick=()=>visit(b.dataset.visit));
  $$('[data-talk]',sh).forEach(b=>b.onclick=()=>talkFromLog(b.dataset.talk,b.dataset.item));

function talkFromLog(from,type){ const nm=CATALOG[type].name; openDM(from,{origin:'내 방 방문 기록에서 시작',sys:`${ROOMS[from].nick}님이 내 방의 ${nm} 사연을 보고 갔어요`,draft:`${nm} 사연 봐 주셔서 반가워요!`}); }

function visitorArrives(){
  if(S.view!=='my-room'||S.editing||S.myVisitorShown) return; S.myVisitorShown=true;
  const o=ROOMS.fossil, r=S.me.room; const target=r.items.find(i=>i.type==='camera')||r.items.find(i=>i.story)||r.items.find(i=>i.type!=='rug');

function matchHTML(){

function renderGrid(){

function hiveSVG(){
  const size=52, sq=Math.sqrt(3), dirs=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
  const ring=rad=>{ const out=[]; let q=dirs[4][0]*rad, r=dirs[4][1]*rad; for(let i=0;i<6;i++) for(let j=0;j<rad;j++){ out.push([q,r]); q+=dirs[i][0]; r+=dirs[i][1]; } return out; };
  const cells=[...ring(1),...ring(2)];
  const sims=Object.values(ROOMS).map(r=>({r,s:common(r).length*3+r.tags.filter(t=>S.me.tags.some(m=>TAG[m]&&TAG[m].cat===TAG[t].cat)).length})).sort((a,b)=>b.s-a.s);
  const placed=[{q:0,r:0,me:true}]; cells.forEach(([q,r],i)=>placed.push(sims[i]?{q,r,room:sims[i].r,s:sims[i].s}:{q,r,empty:true}));
  const pts=Array.from({length:6},(_,k)=>{ const a=Math.PI/180*(60*k-30); return `${(size*Math.cos(a)).toFixed(1)},${(size*Math.sin(a)).toFixed(1)}`; }).join(' ');
  const xy=p=>[size*sq*(p.q+p.r/2),size*1.5*p.r];
  const xs=placed.map(p=>xy(p)[0]), ys=placed.map(p=>xy(p)[1]); const pad=size+6;
  const vb=[Math.min(...xs)-pad,Math.min(...ys)-pad,Math.max(...xs)-Math.min(...xs)+pad*2,Math.max(...ys)-Math.min(...ys)+pad*2];
  const cells2=placed.map(p=>{ const [x,y]=xy(p);
    if(p.me) return `<g class="hex me" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><polygon points="${pts}"/><text class="hx-name" y="-2">내 방</text><text class="hx-tag" y="15" style="fill:var(--on-moss)">${esc(S.me.nick)}</text></g>`;
    if(p.empty) return `<g class="hex empty" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><polygon points="${pts}"/><text class="hx-tag" y="4">빈 칸</text></g>`;
    const r=p.room, cat=TAG[r.tags[0]].cat, cm=common(r);
    return `<g class="hex" data-room="${r.id}" tabindex="0" role="button" aria-label="${esc(r.nick)}의 방" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><polygon points="${pts}" style="fill:color-mix(in srgb,var(--cat-${cat}) ${cm.length?34:18}%,var(--surface))"/><text class="hx-name" y="-4">${esc(r.nick)}</text><text class="hx-tag" y="13">${esc(cm[0]||r.tags[0])}</text>${presence(r)?`<circle cx="0" cy="-28" r="4" style="fill:var(--ok)"/>`:''}</g>`;
  }).join('');
  return `<svg viewBox="${vb.map(n=>n.toFixed(1)).join(' ')}" role="img" aria-label="관심사가 비슷한 방끼리 모인 벌집 지도">${cells2}</svg>`;
}

function openDM(roomId,o){
  o=o||{}; let d=S.dms.find(x=>x.room===roomId);
  if(!d){ d={id:uid('d'),room:roomId,unread:0,origin:o.origin||'방 구경하다가 시작',msgs:[]}; S.dms.unshift(d); }
  else { S.dms.splice(S.dms.indexOf(d),1); S.dms.unshift(d); }
  if(o.quote) d.msgs.push({k:'quote',room:roomId,type:o.quote.type,text:o.quote.story});
  if(o.sys) d.msgs.push({k:'sys',text:o.sys});
  if(ROOMS[roomId]){ ROOMS[roomId].rel=ROOMS[roomId].rel||new Set(); ROOMS[roomId].rel.add('talk'); }
  d.draft=o.draft||''; S.chat.active=d.id; S.chat.open=true; go('chat');
}
function enterChat(){
  const v=$('#v-chat');
  v.innerHTML=`<div class="split ${S.chat.open?'is-open':''}" id="chat-split"><aside class="split-list"><header class="list-head"><h1 class="t-h1">대화</h1><p class="t-small muted">방에서 시작된 대화가 모여요. 어디서 시작됐는지도 함께 보여요.</p></header><ul class="thread-list" id="th-list"></ul></aside><section class="split-main" id="th-main"></section></div>`;
  renderThreads(); renderThread();
}
function lastText(d){ const m=[...d.msgs].reverse().find(x=>x.k!=='typing'); if(!m) return ''; return m.k==='quote'?`[사연] ${m.text}`:m.text; }
function renderThreads(){
  $('#th-list').innerHTML=S.dms.map(d=>{ const r=roomOf(d.room); return `<li><button class="thread ${d.id===S.chat.active?'is-on':''}" data-id="${d.id}">${avDot(r.color,'sm')}<span class="th-body"><span class="th-top"><b>${esc(r.nick)}</b>${d.unread?`<span class="badge">${d.unread}</span>`:''}</span><span class="th-last">${d.blocked?'차단한 상대':esc(lastText(d))}</span><span class="th-origin">${esc(d.origin)}</span></span></button></li>`; }).join('');
  $$('#th-list .thread').forEach(b=>b.onclick=()=>{ S.chat.active=b.dataset.id; S.chat.open=true; $('#chat-split').classList.add('is-open'); renderThreads(); renderThread(); });
}
function msgHTML(m,r){
  if(m.k==='sys') return `<p class="sys ${m.lamp?'lamp':''}">${esc(m.text)}</p>`;
  if(m.k==='typing') return `<div class="msg them">${avDot(r.color,'xs')}<div class="bubble typing" aria-label="입력 중"><i></i><i></i><i></i></div></div>`;
  if(m.k==='quote'){ const o=roomOf(m.room), side=m.by==='them'?'them':'me';
    return `<div class="msg ${side}">${side==='them'?avDot(r.color,'xs'):''}<div class="quote-card"><img data-thumb="icon:${m.type}" alt=""><div><p class="eyebrow">${m.room==='me'?'내 방':esc(o.nick)+'님의 방'} · ${CATALOG[m.type].name}${side==='them'?' 사연을 보고 왔어요':''}</p><p>${esc(m.text)}</p></div></div></div>`; }
  return `<div class="msg ${m.k}">${m.k==='them'?avDot(r.color,'xs'):''}<div class="bubble">${esc(m.text)}</div></div>`;
}
function renderThread(){
  const main=$('#th-main'); const d=S.dms.find(x=>x.id===S.chat.active);
  if(!d){ main.innerHTML=`<div class="main-empty">왼쪽에서 대화를 골라 주세요.<br>방을 구경하다 마음에 드는 사연이 있으면 거기서 대화를 시작할 수 있어요.</div>`; return; }
  d.unread=0; updateBadges(); const r=roomOf(d.room);
  const lastReal=[...d.msgs].reverse().find(m=>m.k!=='sys'&&m.k!=='typing');
  const needReply=!d.blocked&&lastReal&&(lastReal.k==='them'||(lastReal.k==='quote'&&lastReal.by==='them'));
  main.innerHTML=`<header class="main-head"><button class="icon-btn back-btn" id="th-back" aria-label="대화 목록">${I.back}</button>${avDot(r.color,'sm')}
     <div class="mh-title"><b>${esc(r.nick)}</b><span class="presence ${r.online?'on':''}"><i></i>${r.online?'방에 있어요':'자리 비움 · 접속하면 알림이 가요'}</span></div>
     <div class="mh-actions"><button class="btn btn-sm" id="th-visit">${I.home}<span>방 구경</span></button><button class="icon-btn" id="th-more" aria-label="더 보기" aria-haspopup="menu">${I.more}</button>
       <div class="menu" id="th-menu" role="menu" hidden><button role="menuitem" data-m="block">차단하기</button><button role="menuitem" class="danger" data-m="report">신고하기</button></div></div></header>
   <div class="msgs" id="msgs">${d.msgs.map(m=>msgHTML(m,r)).join('')}</div>
   ${needReply?`<div class="quick" id="quick" aria-label="빠른 답장"><button data-q="반가워요! 사연 봐 주셔서 고마워요">반가워요!</button><button data-q="저도요 ㅎㅎ 완전 공감해요">저도요 ㅎㅎ</button><button class="later" data-later="1">나중에 답할게요</button></div>`:''}
   ${d.blocked?`<div class="blocked"><span>차단한 상대예요. 서로 메시지를 보낼 수 없어요.</span><button class="btn btn-sm" id="th-unblock">차단 풀기</button></div>`
     :`<form class="composer" id="composer"><input id="msg-in" placeholder="메시지 보내기" autocomplete="off" value="${esc(d.draft||'')}" aria-label="메시지"><button class="btn btn-primary" aria-label="보내기">${I.send}</button></form>`}`;
  fillImgs(main); const box=$('#msgs'); box.scrollTop=box.scrollHeight;
  $('#th-back').onclick=()=>{ S.chat.open=false; $('#chat-split').classList.remove('is-open'); };
  $('#th-visit').onclick=()=>visit(d.room);
  const menu=$('#th-menu'); $('#th-more').onclick=e=>{ e.stopPropagation(); menu.hidden=!menu.hidden; };
  document.addEventListener('click',()=>{ menu.hidden=true; },{once:true});
  $$('[data-m]',menu).forEach(b=>b.onclick=()=>{ menu.hidden=true; b.dataset.m==='block'?blockModal(d,r):reportModal(r); });
  $$('#quick button',main).forEach(b=>b.onclick=()=>{
    if(b.dataset.later){ d.msgs.push({k:'me',text:'지금은 정신이 없어서, 이따 천천히 답할게요!'}); toast('나중에 답한다고 알렸어요. 서두르지 않아도 돼요'); }
    else { d.msgs.push({k:'me',text:b.dataset.q}); replyLater(d,r); }
    renderThread(); renderThreads(); });
  if(d.blocked){ $('#th-unblock').onclick=()=>{ d.blocked=false; renderThread(); renderThreads(); toast('차단을 풀었어요'); }; return; }
  const input=$('#msg-in'); if(d.draft){ input.focus(); input.setSelectionRange(input.value.length,input.value.length); }
  input.oninput=()=>{ d.draft=input.value; };
  $('#composer').onsubmit=e=>{ e.preventDefault(); const t=input.value.trim(); if(!t) return; d.msgs.push({k:'me',text:t}); d.draft=''; replyLater(d,r); renderThread(); renderThreads(); };
}
const REPLIES=['오 반가워요! 이 얘기 하려면 밤새도 돼요 ㅎㅎ','맞아요, 저도 그래서 시작했어요.','다음에 제 방 한 번 더 놀러 오세요. 새로 들인 게 있어요','헉 그거 알아보시는 분 처음 만나요'];
function replyLater(d,r){
  if(!r.online){ if(!d.msgs.some(m=>m.k==='sys'&&m.offline)) d.msgs.push({k:'sys',offline:true,text:`${r.nick}님은 자리를 비웠어요. 접속하면 메시지를 볼 수 있어요`}); return; }
  setTimeout(()=>{ d.msgs.push({k:'typing'}); if(S.view==='chat'&&S.chat.active===d.id) renderThread(); },700);
  setTimeout(()=>{ d.msgs=d.msgs.filter(m=>m.k!=='typing'); d.msgs.push({k:'them',text:REPLIES[Math.floor(Math.random()*REPLIES.length)]});
    if(S.view==='chat'&&S.chat.active===d.id){ renderThread(); renderThreads(); } else { d.unread++; updateBadges(); } },2200);
}
function blockModal(d,r){

function reportModal(r){

const NF_FILTERS=[['all','전체'],['visit','방문 · 명함'],['like','공감'],['dm','대화'],['match','취향 매칭'],['group','모임']];

function nfView(n){
  const nick=id=>esc(ROOMS[id]?ROOMS[id].nick:'');
  switch(n.t){
    case 'visit': return {ic:I.door,c:'moss',title:`${nick(n.from)}님이 내 방에 다녀갔어요`,sub:esc(n.sub||''),acts:[['이 사연으로 말 걸기','talk',n.from+'|'+n.item,1],['방 구경 가기','visit',n.from]]};
    case 'digest': return {ic:I.door,c:'moss',title:`오늘 내 방에 ${n.names.length}명이 다녀갔어요`,sub:`${n.names.map(esc).join(', ')} · 하루 한 번 모아서 알려 드려요`,acts:[['방문 기록 보기','log','visits',1]]};
    case 'match': { const r=ROOMS[n.room], d=TAG[n.tag]; return {ic:I.spark,c:'lamp',title:`#${esc(n.tag)} 취향의 새 방이 생겼어요`,sub:`${esc(r.nick)} · ${esc(n.tag)}는 전체 ${fmt(d.count)}명뿐인 ${rareLabel(d.count)||''} 취미예요`,acts:[['구경 가기','visit',n.room,1],['취미 보기','tag',n.tag]]}; }
    case 'dm': { const dm=S.dms.find(x=>x.room===n.room); const last=dm?[...dm.msgs].reverse().find(m=>m.k==='them'):null; return {ic:I.chat,c:'',title:`${nick(n.room)}님이 내 ${CATALOG[n.item].name} 사연을 보고 말을 걸었어요`,sub:last?`“${esc(last.text)}”`:'',acts:[['대화 보기','dm',n.room,1]]}; }
    case 'like': return {ic:I.heart,c:'lamp',title:`${nick(n.from[0])}님 외 ${n.from.length-1}명이 ${CATALOG[n.item].name} 사연에 공감했어요`,sub:'누가 공감했는지는 나만 볼 수 있어요',acts:[['공감 기록 보기','log','likes',1]]};
    case 'card': return {ic:I.card,c:'lamp',title:`${nick(n.from)}님이 명함을 두고 갔어요`,sub:`“${esc(n.msg)}”`,acts:[['방 구경 가기','visit',n.from,1],['명함함 보기','log','cards']]};
    case 'group': { const g=S.groups.find(x=>x.id===n.group); return {ic:I.cal,c:'',title:`${esc(g.name)} 일정이 이틀 남았어요`,sub:`${esc(g.event.date)} · ${esc(g.event.place)} · 관심만 눌러 둬도 괜찮아요`,acts:[['일정 보기','group',n.group,1]]}; }
  }

function nfAct(act,arg){
  if(act==='visit') visit(arg);
  else if(act==='talk'){ const [f,t]=arg.split('|'); talkFromLog(f,t); }
  else if(act==='log'){ S.pendingLog=arg; go('my-room'); }
  else if(act==='dm'){ const dm=S.dms.find(x=>x.room===arg); if(dm){ S.chat.active=dm.id; S.chat.open=true; } go('chat'); }
  else if(act==='group') openGroup(arg);
  else if(act==='tag') openTag(arg);
}

function renderNotifList(){

    :'<div class="empty-state">이 분류에는 아직 알림이 없어요.</div>';
  $$('#nf-items [data-act]').forEach(b=>b.onclick=()=>{ const id=b.closest('.nf').dataset.id;

    <a class="nav-item" href="#system" data-nav="system">${I.palette}<span>디자인 시스템</span></a>
    <a class="nav-item" href="#onboarding" data-nav="onboarding">${I.restart}<span>온보딩 처음부터</span></a>`;
  $('#tabbar').innerHTML=[...NAV,['system','시스템',I.palette]].map(([k,l,ic])=>`<a class="tab" href="#${k}" data-nav="${k}">${ic}<span>${l}</span>${k==='chat'||k==='notifications'?`<span class="badge" data-badge="${k==='chat'?'chat':'nf'}" hidden></span>`:''}</a>`).join('');
  $('#notes-fab').innerHTML=`${I.note}<span>기획 노트</span>`; $('#notes-fab').onclick=()=>toggleNotes();
  $$('a[href="#onboarding"]').forEach(a=>a.addEventListener('click',()=>{ S.ob.step=1; }));
}
function updateBadges(){
  const c=S.dms.reduce((s,d)=>s+(d.unread||0),0), n=visibleNotifs().filter(x=>!x.read).length;
  $$('[data-badge]').forEach(b=>{ const k=b.dataset.badge==='nf'?n:c; b.hidden=!k; b.textContent=k; });
}
function go(v){ if(location.hash.slice(1)===v) render(v); else location.hash=v; }
function render(v){
  if(!ENTER[v]) v='onboarding';
  if(v==='visit' && !ROOMS[S.visitId]) S.visitId='byeol';
  if(v==='tag' && !TAG[S.tagId]) S.tagId='테라리움';
  S.view=v; Engine.unmount(); $('#modal').hidden=true;
  $('#app').classList.toggle('is-bare',v==='onboarding');
  $$('.view').forEach(s=>s.classList.toggle('is-active',s.id==='v-'+v));
  const navKey=v==='visit'||v==='tag'?'explore':v; $$('[data-nav]').forEach(a=>a.classList.toggle('is-on',a.dataset.nav===navKey));
  ENTER[v](); renderNotes(v); updateBadges();
}
window.addEventListener('hashchange',()=>render(location.hash.slice(1)));

applyOnboarding();
buildShellUI();
render(location.hash.slice(1)||'onboarding');
setTimeout(()=>{ try{ makeThumbs(); }catch(e){ console.warn('thumbnail render failed',e); } },60);
</script>
